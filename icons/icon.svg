<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Clock Symbol (Departure Time) -->
    <g transform="translate(170, 150)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#ffffff" stroke-width="8" />
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="0" x2="24" y2="14" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Location Pin (Destination) -->
    <g transform="translate(340, 145)">
      <path d="M 0 -30 C -18 -30, -30 -18, -30 0 C -30 20, 0 50, 0 50 C 0 50, 30 20, 30 0 C 30 -18, 18 -30, 0 -30 Z" fill="#ffffff" />
      <circle cx="0" cy="-2" r="11" fill="#6dac20" />
    </g>

    <!-- Route Dashes -->
    <path d="M 220 160 Q 256 140 295 152" stroke="#ffffff" stroke-width="5" stroke-dasharray="6 6" fill="none" stroke-linecap="round" />

    <!-- Car Symbol -->
    <g transform="translate(256, 260)">
      <rect x="-102" y="-12" width="204" height="42" rx="12" fill="#ffffff" />
      <path d="M -68 -12 L -38 -42 L 42 -42 L 72 -12 Z" fill="#ffffff" />
      <path d="M -60 -14 L -34 -36 L -5 -36 L -5 -14 Z" fill="#6dac20" />
      <path d="M 5 -14 L 5 -36 L 38 -36 L 64 -14 Z" fill="#6dac20" />
      <circle cx="-52" cy="30" r="20" fill="#6dac20" />
      <circle cx="-52" cy="30" r="10" fill="#ffffff" />
      <circle cx="52" cy="30" r="20" fill="#6dac20" />
      <circle cx="52" cy="30" r="10" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <!-- Plugin-Name ist die dominante Zeile, LOXBERRY steht klein darunter.

       ZUR GROESSE: 30 px, Sperrung 1. Ein blosser Tausch auf die frueheren
       38 px geht nicht - ABFAHRTSASSISTENT hat 17 Zeichen und waere dann
       447 px breit.

       Massgeblich ist NICHT die Mitte der Zeile, sondern ihre UNTERSTE
       Bildzeile: dort ist der Kreis am schmalsten. Bei Grundlinie 388 liegt
       das bei y=387, wo der innere Ring (r=232) nur 381 px misst. 29 px ergeben
       dort 329 px. In den kleinen Fassungen (64 und 128 px) ruecken Schrift
       und Ring optisch zusammen, weil beide auf wenige Bildpunkte
       zusammenfallen - deshalb 29 statt der rechnerisch noch moeglichen 32. -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="1">ABFAHRTSASSISTENT</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
