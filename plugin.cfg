[AUTHOR]
# NEVER CHANGE this information in future updates! It is used to identify
# the plugin and handle updates.
NAME=Abfahrts-Assistent Plugin Authors
EMAIL=abfahrtsassistent@users.noreply.github.com

[PLUGIN]
# The version of your plugin - important if you would like to write an
# upgrade script.
VERSION=1.6.7
# Short name and preferred subfolder of the plugin (lowercase, no blanks).
# NEVER CHANGE this information in future updates!
NAME=abfahrtsassistent
FOLDER=abfahrtsassistent

# Friendly Long Name of the Plugin - 25 characters maximum!
TITLE=Abfahrts-Assistent

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
# Bei einem neuen Release: VERSION hier und in release.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Abfahrtsassistent/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Abfahrtsassistent/main/prerelease.cfg

[SYSTEM]
# Plugin Interface. Do not change.
INTERFACE=2.0

# No reboot needed after installation.
REBOOT=false

# Compatible with LoxBerry 3.x and 4.x (pure PHP, no extra dependencies).
LB_MINIMUM=3.0.0
LB_MAXIMUM=false

ARCHITECTURE=false
