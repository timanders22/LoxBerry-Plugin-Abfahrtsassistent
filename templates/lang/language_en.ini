[TEXT]
ANSAGE_HINWEIS = "Placeholders: <span class='sm-mono'>{titel} {ort} {fahrt} {abfahrt_in} {beginn}</span>. Leave empty for the supplied text."
DEPARTAT_HINWEIS = "Without this box the traffic situation of <i>now</i> applies — which says nothing about an appointment eight hours away. With it, two queries are made: a rough one, then another for the departure time derived from it. <b>This doubles the queries to the map service</b> (TomTom: daily quota of 2500, Google: a bill). It only applies when the departure is more than 20 minutes away. <b>Switched on by default</b> — untick it if you need to spare your quota."
FEHLER_ERLAEUTERUNG = "<b>On FEHLER=7:</b> if the map service drops out briefly, the last calculated travel time keeps being used for up to an hour. <b>OK stays 1</b> and the values apply. That is deliberate: if the calculation aborted with OK=0 and ABFAHRT_IN=9999 instead, the threshold switch would drop out and fire again on the next successful poll – so the same appointment would announce itself twice. To make the degradation visible, put FEHLER on a status block."
GANZTAGS_HINWEIS = "An all-day appointment states no time — without one there is no way to say when to leave, and it is discarded. With this box ticked, the time set here counts as the start of the appointment on that day."
H_FAHRZEIT = "Travel time calculation"
H_GANZTAGS = "All-day appointments"
H_ORTSBUCH = "Place book — translate a location into an address"
H_SICHERUNG = "Back up and restore settings"
K_SICHERN = "Back up settings"
K_ZURUECK = "Restore settings"
L_ANSAGE_VORLAGE = "Own announcement text"
L_DEPARTAT = "Calculate the travel time for the <b>time of departure</b> instead of for now"
L_GANZTAGS = "Take all-day appointments with a location into account"
L_GANZTAGS_ZEIT = "Treat this as the start time"
L_MQTT_VOLLSEND = "Send all values again, even unchanged ones, every … minutes"
L_QUIET_PUSH = "The quiet period also applies to the push message"
MERKWORT_HINWEIS = "<b>The announcement needs this token.</b> <span class='sm-mono'>termin_say.php</span> sits in the unauthenticated area so that Loxone can reach it without credentials — which is why the call is protected by <span class='sm-mono'>&amp;token=…</span>. Without it anyone on the network could have arbitrary text announced, with <span class='sm-mono'>&amp;force=1</span> even in the middle of the night, because <i>force</i> bypasses the quiet hours. <span class='sm-mono'>termin.php?debug=1</span> is protected as well, because it recalculates and queries the map service while doing so. The cyclic read call to <span class='sm-mono'>termin.php</span> stays open. The address above already contains the token."
MQTT_VOLLSEND_HINWEIS = "Otherwise only what has changed is sent. If the <b>Miniserver</b> restarts without the LoxBerry restarting, its virtual inputs therefore stay empty until some value happens to move. <b>Default 15 minutes</b>, <b>0 = off</b> (behaviour up to 1.5.8)."
ORTSBUCH_HINWEIS = "The calendar field <span class='sm-mono'>LOCATION</span> rarely holds an address; it holds “Office” or “Dentist”. Here you say what is meant. Compared first as a whole entry, then as a standalone word inside the location — <b>never a part of a word, never a guess</b>."
SICH_ABGELEHNT = "The file was NOT accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there."
SICH_FREMD = "Unknown setting in the file: %s"
SICH_KEINE_DATEI = "No file was selected, or the upload failed."
