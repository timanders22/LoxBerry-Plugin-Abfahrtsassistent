H_HTTP2 = "HTTP route, step 2: create one command per value"
HTTP2_TEXT = "Below the HTTP input, create one <i>Virtual HTTP Input Command</i> per value. What matters is the <b>command recognition</b>: %s means “find the text %s and take the number right after it”. The leading semicolon is part of it; without it, FAHRT would also match inside ABFAHRT_IN. The import file further down creates all nine commands at once."
T_BEFEHLSERKENNUNG = "Command recognition"
FEHLER_CODES = "<b>FEHLER</b> gives the reason if something does not work: <b>0</b> all fine, <b>1</b> no calendar, <b>2</b> no map service key, <b>3</b> no departure address, <b>4</b> no appointment with a location in the time window, <b>5</b> calendar unreachable, the last calendar read still applies (OK stays 1), <b>6</b> map service unreachable, <b>7</b> map service unreachable, the last known travel time still applies (OK stays 1), <b>8</b> not a single calendar could be read and no valid state is left (OK=0; up to 1.6.9 this case also carried the 5), <b>9</b> no fresh state: the service has not calculated yet, no longer calculates or could not store the state (OK=0; up to 1.6.21 this showed FEHLER=0)."
H_AUSGANG = "HTTP route: output for the announcement"
AUSGANG_TEXT = "Create a <b>Virtual Output</b> (Miniserver → <i>Virtual Outputs</i>) and enter these values:"
T_ADRESSE_AUSGANG = "Address (virtual output)"
T_BEFEHL_EIN = "Command for ON (output command)"
T_MERKWORT = "Current pass phrase"
LOGIK_TEXT = "<b>Logic on the programming page:</b> the minutes until departure ({F:ABFAHRT_IN}) are compared with your own warning time ({B1}, for example five minutes). When the value reaches or drops below the threshold ({B3}), appointment and travel time are valid (<span class='sm-mono'>{N:OK}</span> = 1, appointment within range, {B8}) and somebody is at home (presence {B27}, AND {B28}), the message still has to be pending for 5 s ({B29}). Only then does the Miniserver send the command {B15} over MQTT if <span class='sm-mono'>{N:AUDIO}</span> = 1, and the plugin speaks the announcement with appointment name and travel time. If <span class='sm-mono'>{N:PUSH}</span> = 1, it also triggers the notification {B16} via {B35} – in the first 5 minutes after a start of the Miniserver only after the start window {B34}. If nobody is at home, there is neither announcement nor push. The announcement checks the quiet hours once more and is skipped as long as the plugin knows no valid appointment.<br><br><b>Pitfalls with the notification block:</b> it only sends on a <b>change from off to on</b>. Never connect several sources directly to the same input; combine them in an OR block first. For tests use the button {B31} with its own notification {B32}."
H_STATUS = "Optional: status block for the app"
STATUS_TEXT = "To have the Loxone app show at any time when to leave: the <b>Status</b> {B14} “Abfahrts-Assistent” in the block list below. Inputs V1 = <span class='sm-mono'>{N:ABFAHRT_IN}</span>, V2 = <span class='sm-mono'>{N:OK}</span>, V3 = <span class='sm-mono'>{N:FEHLER}</span>, V4 = <span class='sm-mono'>{N:FAHRT}</span>, V5 = <span class='sm-mono'>{N:MINSTART}</span>, V6 = delay {B25}, V7 = arrival {B26}, V8 = output E of the analog value validation {B19} “Lebenszeichen fehlt” (V5 to V8 only after clicking the “+” on the block). The 15 lines are in the table, column Parameter: for every error reason a sentence with the remedy, otherwise departure, travel time and arrival – enter them in this order, the line without a condition last. Then enable visualisation for the block. The second status {B30} “Abfahrt Meldewege” tells whether announcement and push are blocked right now."
H_AUDIO = "Does a Music Server or Audioserver have to be linked in Loxone?"
AUDIO_TEXT = "<b>Loxone Music Server (classic) and Audioserver4Home/MusicServer4Home: no.</b> The plugin sends the announcement to the audio server itself over HTTP (address, port and zones from the Settings tab). In Loxone Config the command {B15} is enough; the music zone blocks stay untouched, and the Music Server resumes playback after the announcement.<br><br><b>Loxone Audioserver: yes.</b> It has no HTTP interface for voice output, so the Miniserver has to trigger the announcement itself: a <b>text generator</b> builds the text (triggered by the same pulse as above, i.e. threshold reached, OK = 1 and AUDIO = 1), and its output goes to the <b>TTS input</b> of the <b>audio player</b> of the desired zone. For several zones connect the output to several audio players. In this mode the plugin does not speak itself: over MQTT it rejects the announcement (acknowledgement “abgelehnt: AUDIOSERVER”), over HTTP <span class='sm-mono'>termin_say.php</span> only returns the text (<span class='sm-mono'>TEXT=…</span>)."
H_TECHNIK = "Technical information"
K_DEBUG = "Appointment query (debug)"
H_LOEST_AUS = "Triggers something"
TEST_KNOEPFE_HINWEIS = "<b>Appointment query (debug)</b> recalculates and shows which appointment was found, the travel time, the departure countdown and the hits per calendar; the map service is queried while doing so. <b>Test announcement</b> speaks a fixed sentence with the saved settings right away and deliberately bypasses the box and the quiet hours – meant as a speaker test; no push message is created, that comes from the Miniserver. The announcement of the next appointment is triggered by Loxone through <span class='sm-mono'>termin_say.php</span> (with <span class='sm-mono'>force=1</span> without the box and the quiet hours). New appointments in the calendar show up to ten minutes later because of the cache; “Reload” in the Settings tab fetches them right away."
LOG_TEXT = "Logged are changes in the calculation result, every announcement or its suppression, rejections at the endpoint, configuration changes and errors. Newest entries on top, at most 300. LoxBerry cleans up the log directory regularly, so an empty log can also mean it has been removed."
