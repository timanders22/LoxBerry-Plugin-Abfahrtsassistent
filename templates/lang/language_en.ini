[BEFEHL]

L_ANNEHMEN = "Accept commands over MQTT"
H_ANNEHMEN = "Off by default. Anybody in the home network can send commands via the UDP input of the MQTT gateway. This plugin has no intervening command: only the announcement is accepted (tab “Loxone integration”, step 5), at most once per minute; the plugin checks quiet times, ticks and appointment once more before speaking. Only works with MQTT switched on; the command bridge starts on saving."
H_THEMEN = "In addition the command bridge sends <span class='sm-mono'>%1$s/status/befehle</span> on every one-minute run (1 = running, 0 = off, -1 = fault; never retained) and an acknowledgement <span class='sm-mono'>%1$s/befehl/&lt;name&gt;/quittung</span> for every command (“angenommen” or “abgelehnt: reason”)."
