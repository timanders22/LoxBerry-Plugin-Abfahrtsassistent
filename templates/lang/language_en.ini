WAS_IST_DAS = "<b>Tells you when to leave.</b> The plugin reads up to ten iCal calendars (such as Google Calendar), looks for the next appointment with a location and fetches the current travel time including traffic from TomTom, Google Maps or HERE. From that it calculates the departure time: start of the appointment minus travel time, arrival reserve and buffer. The values reach the Miniserver over MQTT and an HTTP endpoint; on request an announcement or a push message comes in time."

