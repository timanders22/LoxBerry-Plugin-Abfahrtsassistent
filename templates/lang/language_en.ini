H_EINBINDUNG = "Loxone integration, step by step"
EINBINDUNG_TEXT = "The plugin calculates on the LoxBerry and delivers the values to the Miniserver over MQTT. The Miniserver decides when to announce and sends the command “Ansage” back over MQTT for that; the plugin then speaks itself."
H_HTTP1 = "HTTP route, step 1: create a virtual HTTP input"
