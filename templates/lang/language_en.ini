[LOX]
S1_T = "Step 1: switch on MQTT"
S1 = "<b>MQTT is the route of the sample project.</b> The plugin calculates in the background and pushes the values by itself via the MQTT gateway of the LoxBerry to the Miniserver; the command for the announcement comes back the same way. MQTT is on in the plugin by default – check the tick “Publish values via MQTT” in the MQTT tab. The HTTP route (virtual HTTP input with import file, announcement via <span class='sm-mono'>termin_say.php</span> with pass phrase) remains for existing installations (below, “Existing installations: HTTP route”); new installations use MQTT. Both routes deliver the same values – build the logic only once."
S2_T = "Step 2: the MQTT gateway"
S2 = "The topic group of this plugin is:"
S2_THEMEN = "The gateway passes every value to the Miniserver under the name from the table in step 3. You create the virtual inputs for it yourself in Loxone Config (step 3) – nothing appears there by itself."
H_ALTERNATIVE = "Existing installations: HTTP route"
ALTERNATIVE_TEXT = "For installations that already work with the virtual HTTP input “Abfahrts-Assistent” (import file) and the output “Abfahrts-Assistent Ansage” (pass phrase), this route remains unchanged – new installations use MQTT. The Loxone line delivers the same values (names <span class='sm-mono'>ABFAHRT_…</span>, polled every 60 seconds) plus <span class='sm-mono'>ABFAHRT_ALTER</span>, the age of the last calculation in seconds – only available here."
H_BAUSTEINE = "Step 6: complete block list to rebuild one to one"
BAUSTEINE_TEXT = "The page “Abfahrtsassistent” from the LoxBerry plugins sample project, built and connected there in Loxone Config. Work through it from top to bottom and the function is rebuilt. The blocks can be found in Loxone Config with the block search (<b>F5</b>). Rows #1 to #9 and {B18} are the virtual inputs from step 3 – names as in the name table."
T_BAUSTEIN = "Block (type)"
T_NAME = "Name"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Connect inputs to"
BAUSTEINE_ERLAEUTERUNG = "<b>On {B1}:</b> you set the warning time in the app with the slider; {B2} subtracts it from <span class='sm-mono'>{N:ABFAHRT_IN}</span>.<br><b>On {B5}, {B10} and {B11} (dropped):</b> <span class='sm-mono'>{N:OK}</span>, <span class='sm-mono'>{N:AUDIO}</span> and <span class='sm-mono'>{N:PUSH}</span> go directly to the AND; no threshold switch is needed behind them.<br><b>On {B29}:</b> 5 s confirmation so that a short pulse at “Warnzeit erreicht” triggers neither an announcement nor a push message.<br><b>On {B6} and {B7} (data outdated):</b> {B6} inverts <span class='sm-mono'>{N:STATUS_OK}</span> ({B18}) – 1 means: the plugin runs, but its last calculation is older than eleven minutes; {B7} reports it after 600 s.<br><b>On {B19} (heartbeat missing):</b> virtual inputs keep their last value; the app then looks normal even though nothing has arrived for hours. <span class='sm-mono'>{N:STATUS_ZAEHLER}</span> counts one up every minute – if it stands for 900 s, {B19} reports via {B22} to {B24}. There is no age in seconds over MQTT.<br><b>On {F:FEHLER} (error reason):</b> the values <b>5</b> and <b>7</b> are not a failure – a remote side was briefly gone and the last known state still applies. <b>8</b>, however, means that no calendar can be read any more, <b>9</b> that the service is not calculating. {B20} derives the fault from it.<br><b>On {B15}, {B16} and {B24}:</b> the output command and every notification exist exactly once in the project; a second trigger only comes through an OR in front of it. The notification block only sends on a <b>change from off to on</b> – with several sources directly at its input, one permanently active source swallows all others.<br><b>On {B33} to {B35} (start window):</b> after a start of the Miniserver the values arrive via the MQTT gateway only bit by bit; {B34} holds the push message back for 5 minutes so that it does not arise from half-arrived values. If the departure is still due afterwards, {B35} sends it then.<br><b>On {B3} and {B4}:</b> the different switch-on and switch-off thresholds are deliberate – a threshold switch with the same threshold flutters at the switching point."
H_GEGENPROBE = "Step 7: cross-check"
GEGENPROBE = "The <i>Test</i> tab contains the self-check — it tells whether calculations run and whether the heartbeat goes out. If everything is fine there, look at the virtual input %s in Loxone Config: it has to change every minute. Then open %s: the same number as in the MQTT tab has to be there (9999 = no appointment). If the counter stands still, usually the subscription or the tick is missing (step 2), or the name differs (step 3). <b>Only then</b> wire the blocks — whoever starts wiring on a silent input ends up looking for the error in the logic instead of in the connection."
H_VORLAGE = "Create everything at once"
VORLAGE_TEXT = "Creates an import file with all nine virtual inputs including title, meaning and limits. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing — imported twice means duplicate blocks. The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
K_VORLAGE = "Create import file for Loxone Config"
T_LOXONE_NAME = "Input name in Loxone"
VORLAGE_KOMMENTAR = "Created by the LoxBerry plugin Abfahrts-Assistent. Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate blocks."
VORLAGE_AUS_TEXT = "The second file, the <b>template of the control commands</b>, creates the virtual output for the announcement (<span class='sm-mono'>termin_say.php</span>). <b>It carries the token</b> – treat it like a password and create it again after “New token”. It is imported under <i>Virtual Outputs</i>."
K_VORLAGE_AUS = "Create template of the control commands"
VO_KOMMENTAR = "Created by the LoxBerry plugin Abfahrts-Assistent, carries the token. Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate blocks."
VO_BEFEHL = "Speaks the departure announcement"
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “Abfahrtsassistent” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
SEITE1_H = "Page “Abfahrtsassistent”"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
SEITE1_S1 = "In the plugin tab “Settings” enter: calendar (private iCal address), map service with key, departure address, arrival before the appointment, buffer time, time window (15 hours by default), the ticks “Allow announcement” and “Allow push message”, quiet hours, section “Voice output” (speaker). Save. Tab “Test”: the self check is green, “Appointment query (debug)” shows the next appointment with a location, “Test announcement” speaks."
SEITE1_S2 = "In the plugin tab MQTT tick “Publish values via MQTT” (on by default) and “Accept commands over MQTT” and save. This tab, step 2: with gateway V2 tick the data points of the tick list (with V1 nothing needs to be entered)."
SEITE1_S3 = "In Loxone Config create the ten virtual inputs from step 3 (tree on the left “Virtual Inputs”, ribbon “Virtual input”), names exactly as in the name table, do not tick “Use as digital input”. Create the command {B15} “Abfahrts-Assistent: Ansage jetzt sprechen” at the virtual output “LoxBerry MQTT-Gateway” (command on ON <span class='sm-mono'>publish {P}/befehl/ansage 1</span>, command on OFF empty; the page “LoxBerry MQTT-Gateway” of the sample project brings the output) – or import your own output with “Create template: MQTT commands” (step 5), only <b>once</b>."
SEITE1_S4 = "Create the virtual input “Abfahrt Vorwarnung (min)” (tree on the left “Virtual Inputs”, ribbon “Virtual input”): analog, input in the app (slider), Min 0, Max 60, step 1, start value 5, “Use in visualisation” on. “Anwesenheit (eigene Quelle)”: if you have your own presence detection (presence sensor, alarm system disarmed), take its output; otherwise create a virtual input (switch) with this name and leave it at 1. Create “Taste Test-Push Abfahrt” ({B31}) as a virtual input (push button), “Use in visualisation” on."
SEITE1_S5 = "Create the notifications “Zeit zum Losfahren”, “Abfahrtsassistent gestört” and “Test Abfahrts-Push” (Periphery → Messages → Notification), texts as in the table ({B16}, {B24}, {B32}). Each gets exactly one connection."
SEITE1_S6 = "Create the page “Abfahrtsassistent”. Drag onto the page: the ten inputs from step 3 (rows #1 to #9 and {B18}; for <span class='sm-mono'>{N:FAHRT}</span> switch on “Statistics” in the properties), “Abfahrt Vorwarnung (min)”, “Anwesenheit (eigene Quelle)”, “Taste Test-Push Abfahrt”, “Konstante 1” (if you have none, create it with value 1), the command {B15} and the three notifications. Drag the start pulse {B33} onto the page from the tree under “Time functions”; its output AQ is the one to connect."
SEITE1_S7 = "Place the remaining blocks with the block search (<b>F5</b>), parameters as in the table, connect from top to bottom. AND and OR have two inputs each. {B5}, {B10} and {B11} are dropped – place no block there. Status inputs from V5 only appear after clicking the “+” on the block: click four times on status {B14} (V5 to V8). Invert input I2 of the AND {B35}: click the input point, afterwards the input shows a small circle. The lines of the status blocks ({B14}, {B30}) and the texts of the notifications are in the table and are entered by hand – in the given order, the line without a condition last. Type the formulas exactly like this (capital letters, semicolon)."
SEITE1_S8 = "Save and transfer. Check: <span class='sm-mono'>{N:STATUS_ZAEHLER}</span> counts on every minute; “Abfahrts-Assistent” shows the same number of minutes as “Departure in” in the status overview of the plugin; “Abfahrt Meldewege” shows the warning time; the button {B31} sends the test push message. Announcement and push only come when an appointment with a location is within range."
SEITE1_N1 = "You set the warning time in the app: 5 means announcement and push five minutes before the recommended departure; 0 means exactly then."
SEITE1_N2 = "The announcement is spoken by the speaker set in the plugin (Music Server, MS4H, Alexa-NG, Google) – no audio block is needed in Loxone. Exception Loxone Audioserver: there the plugin does not speak; then your own text generator belongs to the TTS input of the audio player (not part of this page, see “Does a Music Server or Audioserver have to be linked in Loxone?” above)."
SEITE1_N3 = "Quiet hours and ticks work in the plugin; the status “Abfahrt Meldewege” tells what is blocked right now."
SEITE1_N4 = "The announcement over MQTT only works with the tick “Accept commands over MQTT” in the MQTT tab. The same announcement within one minute is rejected by the plugin (one-minute lock); the result is in the acknowledgement and in the log."
SEITE1_N5 = "If you change the time window in the plugin, set “Termin in Reichweite” to hours × 60 − 1 (On) and + 1 (Off)."
SEITE1_N6 = "Error reasons 5 and 7 are not a fault: a remote side was briefly gone, the last state still applies; the status says so."
SEITE1_N7 = "After a restart of the Miniserver the push message waits up to 5 minutes ({B34}) so that it does not arise from half-arrived values; if the departure is still due then, it comes."
SEITE1_N8 = "Analog value validation {B19}: Config creates input En inverted (tick at ‚En‘ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S1_EIN = "MQTT is switched on in the plugin – topic group <span class='sm-mono'>%s/#</span>."
S1_AUS = "MQTT is switched off in the plugin – nothing arrives over MQTT, and commands are not accepted. MQTT tab: tick “Publish values via MQTT” and save."
