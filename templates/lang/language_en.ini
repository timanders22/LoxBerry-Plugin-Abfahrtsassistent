NICHTS = "No audio server found. Neither an installed MS4H plugin nor a port answering on this device. Please enter IP and port by hand."
HINWEIS = "Looks for the configuration of an installed Audioserver4Home or MusicServer4Home plugin and otherwise knocks on the usual ports of this device. <b>The find is shown with its source rather than silently applied</b> — the MS4H configuration is not part of this plugin and may change."

[LOX]
S1_T = "Step 1: choose the path"
S1 = "<b>MQTT is the standard route.</b> The plugin calculates in the background and pushes every change to the Miniserver by itself — the Miniserver need not ask, and no cyclic traffic arises for values that have not changed.<br><br>The <b>virtual HTTP input</b> remains available as an alternative. It is the right choice if the MQTT gateway is not to run, and it always serves as a cross-check. <b>Both paths at once are possible but unnecessary</b> — pick one and build the logic only once."
S2_T = "Step 2: the subscription in the MQTT gateway"
S2 = "The topic group of this plugin is:"
S2_THEMEN = "These topics then arrive at the Miniserver. Loxone creates virtual inputs from them by itself on the next reception — visible in Loxone Config under <i>Virtual inputs</i> once the first value has arrived."
H_ALTERNATIVE = "Alternative: virtual HTTP input"
ALTERNATIVE_TEXT = "The following steps describe the <b>second</b> path — Loxone fetches the values itself. Anyone using MQTT can skip them. The block list further down applies to both paths; only the origin of the inputs differs."
H_BAUSTEINE = "Complete block list to rebuild one to one"
BAUSTEINE_TEXT = "Work through it from top to bottom and the function is rebuilt. The blocks can be found in Loxone Config with the block search (<b>F5</b>). The first nine rows are the inputs: with MQTT the gateway creates them itself under the name shown, with the HTTP route they are the commands from the import file."
T_BAUSTEIN = "Block (type)"
T_NAME = "Name (inputs: assigned by the gateway; blocks: suggestion)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Connect inputs to"
B_EINGANG = "Virtual input (MQTT)"
B_THEMA = "Topic"
BAUSTEINE_ERLAEUTERUNG = "<b>On {B6} and {B7} (data outdated):</b> over the HTTP route {B6} is connected to <span class='sm-mono'>ALTER</span>; set the delay well above the calculation cycle, 600 s is a good value. Over MQTT there is no ALTER – there the heartbeat <span class='sm-mono'>status_ts</span> and <span class='sm-mono'>status_zaehler</span> shows a failure (explained in step 2). Virtual inputs keep their last value; the app then looks normal even though nothing has arrived for hours.<br><b>On {F:FEHLER} (FEHLER):</b> the values <b>5</b> and <b>7</b> are not a failure – a remote side was briefly gone and the last known state still applies. Putting a notification on them gives needless alerts. <b>8</b>, however, means that no calendar can be read any more.<br><b>On {B12} and {B13}:</b> the notification block only sends on a <b>change from off to on</b>. Never connect several sources directly to its input – combine them with OR first, otherwise one permanently active source swallows all others.<br><b>On {B3} to {B6}:</b> the different switch-on and switch-off thresholds are deliberate – a threshold switch with the same threshold flutters at the switching point.<br><b>Optional:</b> so that a departure that is already due is not lost after a Miniserver restart, add a <i>system start pulse</i> → <i>off delay 300 s</i> as an extra source before the OR combination."
H_GEGENPROBE = "Cross-check"
GEGENPROBE = "The <i>Test</i> tab contains the self-check — it tells whether calculations run and whether the heartbeat goes out. If everything is fine there, look at the virtual input %s in Loxone Config: it has to change every minute. Then open %s: the same number as in the MQTT tab has to be there. <b>Only then</b> wire the blocks — whoever starts wiring on a silent input ends up looking for the error in the logic instead of in the connection."
H_VORLAGE = "Create everything at once"
VORLAGE_TEXT = "Creates an import file with all nine virtual inputs including title, meaning and limits. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing — imported twice means duplicate blocks. The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
K_VORLAGE = "Create import file for Loxone Config"
T_LOXONE_NAME = "Input name in Loxone"
B_NUR_HTTP = "HTTP route only (command ALTER)"
VORLAGE_KOMMENTAR = "Created by the LoxBerry plugin Abfahrts-Assistent. Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate blocks."

