SICH_TOKEN_BEHALTEN = "The file contained no token. The current one stays valid — the addresses in Loxone Config do not have to be changed."
SICH_WARNUNG = "<b>The file contains your credentials.</b> Without them all fields would look right after restoring and the plugin still would not reach the installation. Treat the file like a password: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SICH_UPLOAD_GRENZE = "The file is larger than the web server accepts (limits: post_max_size %s, upload_max_filesize %s) – it did not arrive. A backup of this plugin is a few kilobytes; please choose the right file. Nothing was changed."
SICH_WARN_KNOPF = "Caution: restoring this backup would be rejected – affected: %s. It is still downloaded in full. Unknown settings usually come from another version of the plugin."
