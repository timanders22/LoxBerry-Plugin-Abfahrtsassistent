BAUSTEINE_ERLAEUTERUNG = "<b>On #14 and #15 (data stale):</b> set the delay <b>well above</b> the calculation interval &mdash; 600 s is a good value. Virtual inputs keep their last value; the app then looks perfectly normal even though nothing has arrived for hours. That is exactly what <span class='sm-mono'>ALTER</span> is for.<br><b>On #5 (FEHLER):</b> the value <b>7</b> is not an outage &mdash; the map service was briefly away and the last known travel time still applies. Putting an alert on it produces needless noise.<br><b>On #20 and #21:</b> the notification block only fires on the <b>transition from off to on</b>. Never wire several sources directly to its input &mdash; merge them through an OR first, otherwise a permanently active source swallows all the others. Use a separate notification block for experiments.<br><b>On #11 to #14:</b> the differing on and off thresholds are deliberate &mdash; a threshold switch with identical thresholds chatters at the switching point.<br><b>Optional:</b> so that an already due departure is not swallowed after a Miniserver restart, add a <i>system start pulse</i> &rarr; <i>off delay 300 s</i> as an additional source ahead of the OR merge."
H_GEGENPROBE = "Cross-check"
GEGENPROBE = "The <i>Test</i> tab holds the self check &mdash; it says whether calculation is happening and whether the MQTT path is complete. If everything is right there, open the virtual input <span class='sm-mono'>Abfahrt ABFAHRT_IN</span> in Loxone Config: the same number must appear. <b>Only then</b> wire up the blocks &mdash; anyone who starts wiring with a silent input will afterwards look for the fault in the logic instead of in the connection."
H_VORLAGE = "Create everything at once"
VORLAGE_TEXT = "Creates an import file with all eight virtual inputs including title, meaning and limits. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing &mdash; imported twice means duplicate blocks. The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
K_VORLAGE = "Create import file for Loxone Config"

