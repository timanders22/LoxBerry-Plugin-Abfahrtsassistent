MERKWORT_HINWEIS = "<b>The announcement needs this token.</b> <span class='sm-mono'>termin_say.php</span> sits in the unauthenticated area so that Loxone can reach it without credentials &mdash; which is why the call is protected by <span class='sm-mono'>&amp;token=&hellip;</span>. Without it anyone on the network could have arbitrary text announced, with <span class='sm-mono'>&amp;force=1</span> even in the middle of the night, because <i>force</i> bypasses the quiet hours. <span class='sm-mono'>termin.php?debug=1</span> is protected as well, because it recalculates and queries the map service while doing so. The cyclic read call to <span class='sm-mono'>termin.php</span> stays open. The address above already contains the token."

