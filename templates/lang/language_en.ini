[MQTT]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_TEXT = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> the plugin brings the file <span class='sm-mono'>mqtt_subscriptions.cfg</span> with the topic group, and the gateway reads it by itself; if the file does not carry the prefix, the line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> The plugin's subscription file (<span class='sm-mono'>mqtt_subscriptions.cfg</span>) does not carry the topic group; it is updated on the next save in the MQTT tab and on the one-minute run. Until then the line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
FEHLER_TOPIC = "The MQTT topic must not be empty."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "Published topics"
KEIN_ABSCHNITT = "There is no MQTT section in the LoxBerry <span class='sm-mono'>general.json</span>. The MQTT gateway is part of the system and is switched on under System → MQTT Gateway - it is not a plugin."
KEIN_AUTOSTART = "The MQTT gateway is not set to autostart (System → MQTT Gateway). Values are sent, but probably nobody is listening."
L_EIN = "Publish values over MQTT"
L_TOPIC = "MQTT topic (prefix)"
OK = "The MQTT gateway is set up, UDP input %d."
T_BEDEUTUNG = "Meaning"
T_THEMA = "Topic"
T_RETAIN = "retained"
RETAIN_JA = "yes"
RETAIN_NEIN = "no"
RETAIN_ERKLAERUNG = "No topic of this plugin is retained. OK and FEHLER are statements of the service about itself, AUDIO and PUSH depend on the quiet times and become wrong by the clock alone – retained, they would still look valid after the service has stopped. The service builds the values on every one-minute run, even when it does not recalculate, and sends what has changed: AUDIO and PUSH follow the quiet time within one minute. After a Miniserver restart the values are missing until the next full send (at the latest after 15 minutes by default). Up to 1.6.12 the four states were retained; the plugin clears their old values itself, and so does the uninstallation."
T_WERT = "latest"
WARUM = "<b>MQTT is the preferred path.</b> The plugin calculates in the background and pushes every change to the Miniserver by itself — so the Miniserver need not ask every minute (polling time of the import file 60 s). Only what actually changed is sent; unchanged values do not occupy the broker. The virtual HTTP input from the <i>Loxone integration</i> tab remains available alongside — as a cross-check and for anyone used to it."
RETAIN_NIE = "never"
LZ_TS = "Heartbeat: time of the last service run (Unix seconds)"
LZ_ZAEHLER = "Heartbeat: counter, cycles from 0 to 999 once a minute"
LZ_OK = "Heartbeat: 1 = the last calculation is at most eleven minutes old"
LZ_ERKLAERUNG = "<b>Failure detection over MQTT:</b> the heartbeat goes out on every one-minute run and is never retained. If <span class='sm-mono'>status/zaehler</span> stops changing, the service, the MQTT gateway or the route to the Miniserver has failed – in Loxone an analog value validation on the virtual input <span class='sm-mono'>…_status_zaehler</span> detects it (Tmc 900 s; tab “Loxone integration”, step 4). <span class='sm-mono'>status/ok</span> tells whether the last calculation is at most eleven minutes old. <span class='sm-mono'>status/ts</span> is only a time stamp for troubleshooting: an age in seconds cannot be calculated from it reliably in Loxone (the Miniserver time is local time, the difference is one to two hours). <b>ALTER is not sent over MQTT</b> – up to 1.6.9 it was always 0 there; over the HTTP route it is correct."
ABO_MITGELIEFERT = "<b>The plugin brings its own subscription</b> — nothing needs to be entered. The file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in the plugin's configuration folder carries the topic group; the MQTT gateway (version&nbsp;1) reads it by itself. It does not appear in the subscription list of the gateway interface, plugin subscriptions are kept in memory. If you change the prefix, the file is updated on saving."
M_ANLASS_AUS = "MQTT switched off"
M_ANLASS_WECHSEL = "Prefix changed"
M_RAEUMEN_NICHTS = "%s: nothing can be retained under %s/ (the broker has already confirmed it for this prefix), nothing had to be cleared."
M_RAEUMEN_BESTAETIGT = "%s: the broker confirms that nothing is retained under %s/."
M_RAEUMEN_GELEERT = "%s: the retained old values under %s/ have been cleared, the broker confirms it."
M_RAEUMEN_REST = "%s: retained values are still stored under %s/ (%s). By hand: mosquitto_pub -r -n -t <topic>"
M_RAEUMEN_UNBEKANNT = "%s: the possible old values under %s/ were deleted with an empty payload; the broker could not be asked, so this is not verified."
M_RAEUMEN_KEIN_PORT = "%s: nothing was cleared under %s/ – the MQTT gateway names no UDP input."
M_RAEUMEN_KEIN_EINGANG = "%s: nothing was cleared under %s/ – the UDP input of the gateway was not reachable."

