HAKEN_NACH = "No topic needs “Noncached” or “Resetaftersend”: there are no pulses, and after a restart of the Miniserver the block “Gateway alles neu senden” on the page “LoxBerry MQTT-Gateway” fetches the values again. The sample page does not need <span class='sm-mono'>%1$s/status/ts</span>. If you want to see the heartbeat of the command bridge in Loxone, also tick <span class='sm-mono'>%1$s/status/befehle</span>."
