SONDERTAGE_HINWEIS = "<b>Public holidays, school holidays and vacation take precedence over the weekday.</b> This lets the announcement start later on days off, for example silent until 07:00 on weekdays and until 09:00 on public holidays. The order of checks is vacation, public holiday, school holiday, weekday; a special day only applies when its box is ticked. The special days come from the LoxBerry plugin “Ferien und Feiertage” (where a vacation is an appointment of the type “Urlaub (abwesend)”). Without that plugin only the weekday table applies."
