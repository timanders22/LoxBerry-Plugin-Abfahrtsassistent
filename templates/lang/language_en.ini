S2_NEUSTART = "After a restart of the Miniserver the gateway only sends the values again when they change or when it is asked to (the plugin also resends everything every 15 minutes, MQTT tab). The request comes with the page “LoxBerry MQTT-Gateway” from the sample project (start pulse → “Gateway alles neu senden”)."
S3_T = "Step 3: create virtual inputs"
S3_TEXT = "There is no template to import for the values via the MQTT gateway: in Loxone Config create one <b>virtual input</b> per value (Periphery → Virtual Inputs → Virtual input). The name has to be exactly as in the table – the gateway sends the value under this name (copy button next to it). The table follows the prefix from the MQTT tab."
T_KOPIEREN = "Name (to copy)"
T_BEREICH = "Range / unit"
KOPIEREN = "copy"
KOPIERT = "copied"
S3_DIGITAL = "In the properties of the virtual input do NOT activate “Use as digital input” – the 0/1 values also arrive as numbers; limits as in the column “Range”. 9999 (no appointment) and 1440 (arrival unknown) are deliberate placeholders; this plugin does not send −1, because for the minutes until departure −1 is a valid value (one minute overdue)."
S3_RECHTE = "The LoxBerry user stored in the Miniserver (setting of the MQTT gateway) needs rights on these inputs in Loxone Config – otherwise the Miniserver does not accept the values."
S3_MUSTER = "If you copy the page “Abfahrtsassistent” from the LoxBerry plugins sample project into your project, you get the inputs with it (step 6, link below the picture)."
S4_T = "Step 4: failure detection"
S4_TEXT = "Virtual inputs keep their last value: if the plugin, the MQTT gateway or the LoxBerry is silent, the app looks normal. The heartbeat <span class='sm-mono'>%1$s</span> counts one up on every one-minute run (0 to 999, never retained) – on an analog value validation with Tmc 900 seconds (15 runs; the UDP input of the gateway loses single messages under load, a single gap reports nothing), Min 0, Max 999, En = constant 1 (remove the tick at ‚En‘ in the properties). In addition <span class='sm-mono'>%2$s</span>: 1 = the last calculation is at most eleven minutes old; through a NOT and an on-delay of 600 seconds it reports when the service runs but does not calculate. There is no age in seconds over MQTT. The page in step 6 combines both into one fault message ({B6}, {B7}, {B19}, {B24})."
S5_T = "Step 5: commands from Loxone"
S5_TEXT = "Loxone sends the command via a virtual output to the UDP input of the MQTT gateway; the plugin only accepts it with the tick “Accept commands over MQTT” in the MQTT tab (off by default). With gateway V1 and V2 nothing needs to be entered or ticked for it. In the sample project the command {B15} “Abfahrts-Assistent: Ansage jetzt sprechen” hangs on the shared output “LoxBerry MQTT-Gateway”; the template below creates an output of its own, “Abfahrts-Assistent MQTT-Befehle”, with the same command. Every command gets an acknowledgement under <span class='sm-mono'>{P}/befehl/ansage/quittung</span> (“angenommen” or “abgelehnt: reason”)."
S5_KEINE = "The command list cannot be read (bin/befehlsbruecke.php or bin/befehle_zuordnung.php is missing or broken) – Test tab, “Command bridge”."
K_VORLAGE_MQTT = "Create template: MQTT commands"
VORLAGE_MQTT_TEXT = "Creates a virtual output “Abfahrts-Assistent MQTT-Befehle” (address <span class='sm-mono'>/dev/udp/&lt;LoxBerry&gt;/&lt;UDP input&gt;</span>, one command with a fixed 1); it is imported under <i>Virtual Outputs</i>. If you take over the page “LoxBerry MQTT-Gateway” from the sample project, you do not need it – there the command sits on the shared output. The file carries no pass phrase."
HTTP_N4 = "After “Draw a new pass phrase” create the control commands again and replace the address of the command “Abfahrt: Ansage” in Config – do not import again, otherwise the command is there twice."
HTTP_GEGENPROBE = "<b>Cross-check for the HTTP route:</b> in the virtual HTTP input “Abfahrts-Assistent” (polling time 60 s) <span class='sm-mono'>ABFAHRT_ALTER</span> shows after the first poll how many seconds ago the last calculation was, and <span class='sm-mono'>ABFAHRT_ABFAHRT_IN</span> the same number of minutes as “Departure in” in the status overview of the plugin (9999 = no appointment)."

