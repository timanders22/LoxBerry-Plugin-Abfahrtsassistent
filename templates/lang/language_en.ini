VORLAGE_URL_HINWEIS = "Placeholders: <span class='sm-mono'>{ip} {port} {zones} {vol} {lang} {text}</span>. Empty means the built-in template. The address has to start with http:// or https:// and point into the home network, because it carries the appointment title."
AUDIOSERVER_HINWEIS = "The Loxone Audioserver has <b>no HTTP interface for voice output</b>. In this mode <span class='sm-mono'>termin_say.php</span> only returns the announcement text as <span class='sm-mono'>TEXT=…</span>; the speaking is done in Loxone Config through a text generator on the TTS input of the audio player."
H_BENACHRICHTIGUNGEN = "Notifications"
L_AUDIO_AKTIV = "Allow announcement"
L_PUSH_AKTIV = "Allow push message"
BENACHRICHTIGUNG_HINWEIS = "Both boxes ticked means announcement and push, one of them only that output, none means no message at all. The permissions go to Loxone as <span class='sm-mono'>AUDIO</span> and <span class='sm-mono'>PUSH</span>; the push message is sent by the Miniserver."
H_SPERRZEITEN = "Quiet hours for the announcement"
SPERRZEITEN_HINWEIS = "During quiet hours the speaker stays silent so that an early departure does not wake anyone. The push message still arrives unless the box below is ticked. Periods across midnight (for example 20:00 to 07:00) are allowed; the same start and end time blocks the whole day."
SPERRZEIT_VON = "blocked from"
SPERRZEIT_BIS = "to"
SPERRZEIT_UHR = ""
SONDERTAGE_HINWEIS = "<b>Public holidays, school holidays and vacation take precedence over the weekday.</b> This lets the announcement start later on days off, for example silent until 07:00 on weekdays and until 09:00 on public holidays. The order of checks is vacation, public holiday, school holiday, weekday; a special day only applies when its box is ticked. The special days come from the LoxBerry plugin “Ferien und Feiertage” (where a vacation is an appointment of the type “Urlaub (abwesend)”). Without that plugin only the weekday table applies."
STATUS_KEIN_FERIENPLUGIN = "Current state: the holidays plugin is not reachable, only the weekday table applies."
STATUS_NORMALTAG = "an ordinary day"
STATUS_HEUTE = "Current state: today is %s, the row that applies is %s."
STATUS_KEINE_ZEILE = "none (announcements allowed at any time)"
K_SPEICHERN = "Save"
H_EINBINDUNG = "Loxone integration, step by step"
EINBINDUNG_TEXT = "The plugin calculates on the LoxBerry and delivers the values to the Miniserver. The Miniserver decides when to announce and calls the plugin’s announcement for that."
H_HTTP1 = "HTTP route, step 1: create a virtual HTTP input"
HTTP1_TEXT = "In <b>Loxone Config</b> click the Miniserver in the tree view, create a <i>Virtual HTTP Input</i> under <i>Virtual Inputs</i> and enter in its properties:"
T_EIGENSCHAFT = "Property"
T_WERT = "Value"
T_ABFRAGEZYKLUS = "Polling cycle"
ABFRAGEZYKLUS_WERT = "60 seconds (as in the import file)"
HTTP1_ANTWORT = "The Miniserver then calls this address by itself. The answer looks like this, for example:"
H_HTTP2 = "HTTP route, step 2: create one command per value"
HTTP2_TEXT = "Below the HTTP input, create one <i>Virtual HTTP Input Command</i> per value. What matters is the <b>command recognition</b>: %s means “find the text %s and take the number right after it”. The leading semicolon is part of it; without it, FAHRT would also match inside ABFAHRT_IN. The import file further down creates all nine commands at once."
T_BEFEHLSERKENNUNG = "Command recognition"
FEHLER_CODES = "<b>FEHLER</b> gives the reason if something does not work: <b>0</b> all fine, <b>1</b> no calendar, <b>2</b> no map service key, <b>3</b> no departure address, <b>4</b> no appointment with a location in the time window, <b>5</b> calendar unreachable, the last calendar read still applies (OK stays 1), <b>6</b> map service unreachable, <b>7</b> map service unreachable, the last known travel time still applies (OK stays 1), <b>8</b> not a single calendar could be read and no valid state is left (OK=0; up to 1.6.9 this case also carried the 5)."
H_AUSGANG = "Triggering the announcement and the push"
AUSGANG_TEXT = "Create a <b>Virtual Output</b> (Miniserver → <i>Virtual Outputs</i>) and enter these values:"
T_ADRESSE_AUSGANG = "Address (virtual output)"
T_BEFEHL_EIN = "Command for ON (output command)"
T_MERKWORT = "Current pass phrase"
LOGIK_TEXT = "<b>Logic on the programming page:</b> compare <span class='sm-mono'>ABFAHRT_IN</span> with your own warning time, for example five minutes. When the value reaches or drops below the threshold (threshold switch) and <span class='sm-mono'>OK=1</span>, the Miniserver switches the virtual output if <span class='sm-mono'>AUDIO=1</span>, and the plugin speaks the announcement with appointment name and travel time. If <span class='sm-mono'>PUSH=1</span>, it also triggers a notification block. The announcement checks the quiet hours once more and is skipped as long as the plugin knows no valid appointment.<br><br><b>Pitfalls with the notification block:</b> it only sends on a <b>change from off to on</b>. If the trigger is already on, for instance because the Miniserver restarted right into a due departure, nothing happens. Never connect several sources directly to the same input; combine them in an OR block first. For tests use a separate notification block on a push button."
H_STATUS = "Optional: status block for the app"
STATUS_TEXT = "To have the Loxone app show at any time when to leave, create a <b>Status</b> block: input 1 to <span class='sm-mono'>ABFAHRT_IN</span>, input 2 to <span class='sm-mono'>FAHRT</span>, input 3 to <span class='sm-mono'>OK</span>. Inside the block, two texts: with the condition <i>input 3 equals 1</i> the text <span class='sm-mono'>Next appointment: leave in &lt;v1.0&gt; min (travel time &lt;v2.0&gt; min)</span>, and as default text without a condition <span class='sm-mono'>No appointment with a location in the time window</span>. Then enable visualisation for the block."
H_AUDIO = "Does a Music Server or Audioserver have to be linked in Loxone?"
AUDIO_TEXT = "<b>Loxone Music Server (classic) and Audioserver4Home/MusicServer4Home: no.</b> The plugin sends the announcement to the audio server itself over HTTP (address, port and zones from the Settings tab). In Loxone Config the virtual output from above is enough; the music zone blocks stay untouched, and the Music Server resumes playback after the announcement.<br><br><b>Loxone Audioserver: yes.</b> It has no HTTP interface for voice output, so the Miniserver has to trigger the announcement itself: a <b>text generator</b> builds the text (triggered by the same pulse as above, i.e. threshold reached, OK=1 and AUDIO=1), and its output goes to the <b>TTS input</b> of the <b>audio player</b> of the desired zone. For several zones connect the output to several audio players. In this mode <span class='sm-mono'>termin_say.php</span> only returns the text (<span class='sm-mono'>TEXT=…</span>) and does not speak itself."
H_TECHNIK = "Technical information"
K_DEBUG = "Appointment query (debug)"
H_LOEST_AUS = "Triggers something"
K_ANSAGE = "Trigger announcement now"
TEST_KNOEPFE_HINWEIS = "<b>Appointment query (debug)</b> recalculates and shows which appointment was found, the travel time, the departure countdown and the hits per calendar; the map service is queried while doing so. <b>Trigger announcement now</b> speaks immediately and deliberately bypasses the box and the quiet hours (parameter <span class='sm-mono'>force=1</span>) – meant as a speaker test; no push message is created, that comes from the Miniserver. New appointments in the calendar show up to ten minutes later because of the cache; “Reload” in the Settings tab fetches them right away."
LOG_TEXT = "Logged are changes in the calculation result, every announcement or its suppression, rejections at the endpoint, configuration changes and errors. Newest entries on top, at most 300. LoxBerry cleans up the log directory regularly, so an empty log can also mean it has been removed."
