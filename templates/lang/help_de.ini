; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Abfahrts-Assistent"
K02 = "Sagt an, wann man losfahren muss: Das Plugin liest bis zu <b>10 iCal-Kalender</b> (z. B. Google Kalender), sucht den nächsten Termin <b>mit Ortsangabe</b>, ermittelt die aktuelle <b>Fahrzeit inkl. Verkehrslage</b> (TomTom, Google Maps oder HERE) und berechnet daraus den Abfahrtszeitpunkt:"
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4.0</b> (laeuft unter PHP 7.4 und 8.x, keine Zusatzpakete). Serientermine werden vollständig expandiert (täglich/wöchentlich/monatlich/ jährlich mit INTERVAL, BYDAY, UNTIL, COUNT; EXDATE; einzeln verschobene oder gelöschte Instanzen via RECURRENCE-ID/STATUS:CANCELLED; DST-sicher). [v1.1.0]"
K04 = "<b>v1.1.1:</b> Konfiguration bleibt bei Updates erhalten (preupgrade/postupgrade); Zonen-Feld akzeptiert einfache Zonenliste (<code>2,4,6</code>) &mdash; Lautst&auml;rke kommt dann aus dem Lautst&auml;rke-Feld; <code>Zone~Lautst&auml;rke</code> je Zone weiterhin m&ouml;glich."
K05 = "Wenn etwas nicht geht"
K06 = "Der Reiter <i>Test</i> hat eine <b>Selbstprüfung</b>, die ohne Loxone beantwortet, ob die Einrichtung trägt — von unten nach oben: Kalender, API-Key, Adresse, Dateirechte, läuft der Hintergrunddienst, was hat er zuletzt gerechnet, Feiertagsquelle, Audioausgabe, Sperrzeit, MQTT-Weg, Vorlage. Der erste Kreuz-Eintrag ist meist die Ursache."
K07 = "<b>Zu <code>FEHLER=7</code>:</b> Der Kartendienst war kurz nicht erreichbar, die letzte bekannte Fahrzeit gilt weiter, <code>OK</code> bleibt 1. Das ist Absicht — bräche die Berechnung stattdessen ab, fiele der Schwellwertschalter in Loxone kurz aus und löste danach ein zweites Mal aus: derselbe Termin sagte zweimal Bescheid."
K08 = "Konfiguration (Plugin-Oberfläche)"
K09 = "Bis zu 10 Kalender (Name + private iCal-URL)"
K10 = "Kartendienst: <b>TomTom</b> / <b>Google Maps</b> / <b>HERE</b> + eigener API-Key"
K11 = "Abfahrtsadresse (Zuhause)"
K12 = "<b>Ankunft X Minuten vor Termin</b> und <b>Pufferzeit</b>"
K13 = "Sprachausgabe:"
K14 = "<b>Loxone Music Server</b> (klassisch): direkte TTS-Ansage über Port 7091"
K15 = "<b>Audioserver4Home / MusicServer4Home</b>: URL-Vorlage (anpassbar)"
K16 = "<b>Original Loxone Audioserver</b>: hat keine HTTP-TTS-Schnittstelle — das Plugin liefert den Ansagetext, die Ausgabe erfolgt in Loxone Config über Textgenerator → TTS-Eingang des Audioplayer-Bausteins"
K17 = "<b>Eigene URL-Vorlage</b> mit Platzhaltern <code>{ip} {port} {zones} {vol} {lang} {text}</code>"
K18 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten — Kalender-URLs, API-Key und Adressen werden ausschließlich in der lokalen Konfiguration (<code>config/plugins/&lt;plugin&gt;/abfahrt.json</code>) gespeichert."
K19 = "Weg nach Loxone"
K20 = "<b>MQTT ist ab 1.5.0 der Regelweg.</b> Das Plugin rechnet im Hintergrund (Cron, jede Minute) und schiebt jede Änderung selbst zum Miniserver. Dafür muss das Abo <code>abfahrt/#</code> im MQTT-Gateway stehen (System → MQTT Gateway → Subscriptions) — <b>ohne diesen Eintrag kommt am Miniserver nichts an</b>, das ist die häufigste Fehlerursache. Der Reiter <i>MQTT</i> zeigt Abo und alle Themen."
K21 = "Der <b>virtuelle HTTP-Eingang</b> bleibt als Alternative bestehen. Wichtig: <code>termin.php</code> <b>rechnet nicht mehr selbst</b>, sondern gibt den Zwischenstand aus. Dadurch hängt die Zahl der Anfragen an den Kartendienst nicht mehr daran, wie oft Loxone fragt. Nur <code>?debug=1</code> rechnet neu."
K22 = "Der Reiter <i>Einbindung in Loxone</i> erzeugt auf Knopfdruck eine fertige Importdatei für Loxone Config und enthält die vollständige Baustein-Liste zum Nachbauen — für beide Wege."
K23 = "Endpunkte (für Loxone)"
K24 = "<b>Virtueller HTTP-Eingang</b> (alle 5 min): Befehlserkennung <code>\i;ABFAHRT_IN=\i\v</code>. <b>Virtueller Ausgang</b> (bei Abfahrt/Vorwarnung): <code>/plugins/abfahrtsassistent/termin_say.php</code>."
K25 = "Hinweise"
K26 = "Termine ohne Ortsangabe (LOCATION) werden ignoriert — nur für Termine mit Ziel lässt sich eine Fahrzeit berechnen."
K27 = "Ganztagestermine werden ignoriert."
K28 = "Abfragelimits: ICS-Zwischenspeicher 10 min; der Routen-Zwischenspeicher richtet sich nach der Naehe zum Termin (ueber 3 h stuendlich, 1&ndash;3 h viertelstuendlich, letzte Stunde alle 5 min); Koordinaten 90 Tage."
K29 = "<b>v1.2.0:</b> Getrennte Aktivierung von Audioausgabe und Push-Nachricht; Sperrzeiten für die Audioausgabe je Wochentag (auch über Mitternacht); Flags <code>AUDIO=</code>/<code>PUSH=</code> in der termin.php-Ausgabe für Loxone; Umlaute in der Ansage korrekt („Nächster“); Test-Button umgeht Sperren (<code>?force=1</code>)."
K30 = "<b>v1.3.0:</b> Admin-Oberfläche mit Reitern (Einstellungen / Einbindung in Loxone mit Laien-Anleitung / Test / Logdateien); Button „Kalender neu einlesen“ je Kalender; Logging (Ergebnis-Änderungen, Ansagen, Fehler); Konfig-Sicherung zusätzlich außerhalb des Plugin-Ordners (übersteht auch Neuinstallation); leere Kalendernamen bleiben leer (Platzhalter); Sperrzeit-Defaults 20:00–07:00; kompaktes Sperrzeiten-Layout."
K31 = "<b>v1.3.1:</b> Layout-Korrekturen: LoxBerry-eigene jQuery-Mobile-Styles neutralisiert (<code>data-role='none'</code> + CSS) — Kalenderfelder wieder voll breit, „Neu einlesen“ kompakt, Reiter/Buttons ohne Schatten, weiße Schrift auf farbigen Buttons."
K32 = "<b>v1.3.2:</b> Loxone-Anleitung um Statusbaustein (Schritt 4) und Audio-System-Verkabelung (Schritt 5: Music Server/MS4H = keine Loxone-Verknüpfung nötig; Original-Audioserver = Textgenerator→TTS-Eingang) ergänzt; Log-Kasten ohne Schatten; Status-Zeile in vollen Minuten (aufgerundet); Standard-Lautstärke 8 %; Zonen: Leerzeichen nach Komma erlaubt; Logdatei übersteht Updates."
K33 = "<b>v1.3.3:</b> Loxone-Anleitung: Schritt 6 mit kompletter Baustein-Liste zum 1:1-Nachbau (inkl. Vorwarnung, invertierter Schwellwertschalter, UND-Gatter, Audio/Push-Gates, Neustart-Nachholung; Erklärung, warum kein Ankunftsreserve-Baustein nötig ist)."
K34 = "<b>v1.3.4:</b> Oberfläche im LoxBerry-Grün (#6dac20)."
K35 = "<b>v1.3.5:</b> Anleitung: Ankunftsreserve-Absatz entfernt; Praxis-Hinweise zum Benachrichtigungs-Baustein ergänzt (Flankenverhalten, keine Mehrfachquellen am Push-Eingang, eigener Test-Baustein)."
K36 = "<b>v1.3.6:</b> Online-Termin-Filter: Ortsangaben wie „ONLINE“, „Teams“, „Zoom“ (konfigurierbare Liste) sowie Meeting-Links (http/https) werden ignoriert — keine Fahrzeitberechnung für Videokonferenzen."
K37 = "<b>v1.3.7:</b> Standard-Lautstärke der Ansagen von 20 % auf 8 % gesenkt; Ansagen beginnen jetzt mit „Hallo!“ statt „Ding Dong!“. Beides betrifft nur die Voreinstellung neuer Installationen — bestehende Einstellungen bleiben erhalten. Neu bei den Sperrzeiten: drei zusätzliche Zeilen <b>Feiertag, Ferien und Urlaub</b>, die dem Wochentag vorgehen (Prüfreihenfolge Urlaub → Feiertag → Ferien → Wochentag). Damit lässt sich die Ansage an freien Tagen später freigeben. Die Sondertage kommen aus dem optionalen LoxBerry-Plugin „Ferien und Feiertage“ (Urlaub = eigener Termin der Art „Urlaub (abwesend)“); ist es nicht installiert, bleiben die drei Zeilen wirkungslos und es gilt allein die Wochentagstabelle. Für die Veröffentlichung anonymisiert (Autorenangabe, MIT-Lizenz, Datenschutz- Hinweis) — Hinweis: durch die geänderte Autorenangabe kann LoxBerry das Plugin als „neu“ ansehen; die Konfiguration überlebt das dank der Sicherung außerhalb des Plugin-Ordners."
K38 = "Datenschutz"
K39 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Kalender-URLs, API-Key, Adressen und Zonen liegen ausschließlich in der lokalen Konfiguration (<code>config/plugins/abfahrtsassistent/abfahrt.json</code>) und werden nie mitgeliefert. Externe Verbindungen bestehen nur zu den vom Nutzer selbst eingetragenen Kalendern und zum gewählten Kartendienst (TomTom, Google Maps oder HERE)."
K40 = "<b>v1.5.0:</b> MQTT-Push über das LoxBerry-Gateway samt eigenem Reiter (nur Änderungen werden gesendet); Rechnen in den Hintergrunddienst verlagert — <code>termin.php</code> liest nur noch ab; Importdatei für Loxone Config auf Knopfdruck; Baustein-Liste auf MQTT umgeschrieben; Selbstprüfung im Reiter <i>Test</i>; Feld <code>FEHLER</code> mit Zahlencode und <code>ALTER</code> für die Ausfallerkennung; Fahrzeit gilt bei einem Ausfall des Kartendienstes bis zu eine Stunde weiter; Routen-Cache skaliert mit der Nähe zum Termin; Serientermine werden vorgespult; Audio-Server-Suche; Webserver-Port aus der <code>general.json</code>; Konfiguration mit Rechten 0600."
K41 = "Endpunkt"
K42 = "Zweck"
K43 = "<code>/plugins/abfahrtsassistent/termin.php</code>"
K44 = "Flat-Text: <code>TERMIN;OK=1;MINSTART=..;FAHRT=..;ABFAHRT_IN=..;FEHLER=..;ALTER=..;AUDIO=..;PUSH=..</code> — liest nur ab"
K45 = "<code>/plugins/abfahrtsassistent/termin.php?debug=1</code>"
K46 = "Diagnose — <b>rechnet neu</b>"
K47 = "<code>/plugins/abfahrtsassistent/termin_say.php</code>"
K48 = "Ansage auslösen (bzw. <code>TEXT=...</code> im Audioserver-Modus)"
K49 = "<b>v1.5.8:</b> Fehlerbehebungen nach einer Zeile-fuer-Zeile-Pruefung. Wichtig fuer bestehende Anlagen: <b>Das Merkwort ueberlebt jetzt das Speichern.</b> Bisher erzeugte jedes Speichern der Einstellungen ein neues, und der Virtuelle Ausgang im Miniserver bekam ab da HTTP 403 &ndash; die Ansage verstummte ohne Meldung. Im Kalender: Serien am Monatsletzten sprangen in den Folgemonat (31.01. + 1 Monat = 03.03.), &bdquo;jeder dritte Donnerstag&ldquo; und &bdquo;letzter Freitag&ldquo; lagen ab dem zweiten Monat falsch, <code>FREQ=DAILY;BYDAY=MO-FR</code> loeste auch am Wochenende aus, und Termine aus Outlook (<code>LOCATION;LANGUAGE=de-DE:</code>) wurden gar nicht gefunden. Die Sperrzeit ueber Mitternacht gilt jetzt der Nacht, in der sie beginnt. Die Befehlserkennungen im Reiter <i>Einbindung in Loxone</i> tragen das fuehrende Semikolon, und die Baustein-Liste nennt das Merkwort in der Ausgangsadresse. Vorgabelautstaerke wirkt wieder (8 statt 25). Oberflaeche auch ohne JavaScript bedienbar."
K50 = "<b>v1.6.0:</b> Zehn Erweiterungen. <b>Zwei wirken sofort:</b> die Fahrzeit wird kuenftig fuer den <b>Abfahrtszeitpunkt</b> berechnet (verdoppelt die Abfragen beim Kartendienst &ndash; Haken in den Einstellungen herausnehmen, wenn das Kontingent knapp ist), und alle MQTT-Werte gehen alle 15 Minuten erneut hinaus. Die uebrigen acht stehen ab Werk <b>aus</b>. Fahrzeit wahlweise fuer den <b>Abfahrtszeitpunkt</b> statt fuer jetzt (verdoppelt die Abfragen beim Kartendienst). <b>Ortsbuch</b>: uebersetzt Kalenderangaben wie &bdquo;Buero&ldquo; in eine Adresse &ndash; wortgleich oder als eigenstaendiges Wort, nie als Teilwort. <b>Diagnose je Kalender</b> im Reiter Test: Gegenstelle, Alter des Zwischenspeichers, Zahl der Termine, naechster Treffer. Knoepfe <b>Merkwort pruefen</b> (loest nichts aus) und <b>Merkwort neu wuerfeln</b> (mit Rueckfrage). Die <b>Koordinaten</b> der Abfahrtsadresse sind sichtbar und lassen sich verwerfen. Die <b>Sperrzeit</b> gilt auf Wunsch auch fuer die Push-Nachricht. Eigener <b>Ansagetext</b> mit Platzhaltern. Neues Feld <code>ANKUNFT</code> (Minuten seit Mitternacht, 1440 = unbekannt) &ndash; es steht am Ende der Liste, damit bestehende Befehlserkennungen gueltig bleiben. MQTT kann alle Werte in einem einstellbaren Abstand erneut senden, damit ein neu gestarteter Miniserver nicht mit leeren Eingaengen dasteht. <b>Ganztagestermine</b> wahlweise mit einstellbarer Uhrzeit."
