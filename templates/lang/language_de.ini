HTTP2_TEXT = "Unter dem HTTP-Eingang wird je Wert ein <i>Virtueller HTTP-Eingang Befehl</i> angelegt. Entscheidend ist die <b>Befehlserkennung</b>: %s heißt „suche die Zeichenfolge %s und übernimm die Zahl direkt dahinter“. Das Semikolon am Anfang gehört dazu, sonst fände FAHRT auch die Stelle in ABFAHRT_IN. Die Importdatei weiter unten legt alle neun Befehle auf einmal an."
T_BEFEHLSERKENNUNG = "Befehlserkennung"
FEHLER_CODES = "<b>FEHLER</b> nennt den Grund, falls etwas nicht klappt: <b>0</b> alles in Ordnung, <b>1</b> kein Kalender, <b>2</b> kein Schlüssel des Kartendienstes, <b>3</b> keine Abfahrtsadresse, <b>4</b> kein Termin mit Ort im Zeitfenster, <b>5</b> Kalender nicht erreichbar, der zuletzt gelesene Stand gilt weiter (OK bleibt 1), <b>6</b> Kartendienst nicht erreichbar, <b>7</b> Kartendienst nicht erreichbar, die zuletzt bekannte Fahrzeit gilt weiter (OK bleibt 1), <b>8</b> kein einziger Kalender ließ sich lesen und es gibt keinen gültigen Stand mehr (OK=0; bis 1.6.9 trug dieser Fall ebenfalls die 5), <b>9</b> kein frischer Stand: der Dienst hat noch nicht gerechnet, rechnet nicht mehr oder konnte den Stand nicht ablegen (OK=0; bis 1.6.21 stand hier FEHLER=0)."
H_AUSGANG = "Ansage und Push auslösen"
