[TEXT]
ANSAGE_HINWEIS = "Platzhalter: <span class='sm-mono'>{titel} {ort} {fahrt} {abfahrt_in} {beginn}</span>. Leer lassen für den mitgelieferten Text."
DEPARTAT_HINWEIS = "Ohne diesen Haken gilt die Verkehrslage von <i>jetzt</i> — für einen Termin in acht Stunden sagt die nichts. Mit Haken wird zweimal gefragt: einmal grob, dann noch einmal für den ermittelten Abfahrtszeitpunkt. <b>Das verdoppelt die Abfragen beim Kartendienst</b> (TomTom: Tageskontingent 2500, Google: Rechnung). Greift nur, wenn die Abfahrt mehr als 20 Minuten entfernt ist. <b>Ab Werk eingeschaltet</b> — wer sein Kontingent schonen muss, nimmt den Haken heraus."
FEHLER_ERLAEUTERUNG = "<b>Zu FEHLER=7:</b> Fällt der Kartendienst kurz aus, wird die zuletzt berechnete Fahrzeit bis zu eine Stunde lang weiterverwendet. <b>OK bleibt dabei 1</b>, die Werte gelten. Das ist Absicht: bräche die Berechnung stattdessen mit OK=0 und ABFAHRT_IN=9999 ab, fiele der Schwellwertschalter ab und löste beim nächsten gelungenen Abruf ein zweites Mal aus – derselbe Termin sägte also zweimal Bescheid. Wer die Degradierung sichtbar machen möchte, legt FEHLER auf einen Statusbaustein."
GANZTAGS_HINWEIS = "Ein Ganztagestermin nennt keine Uhrzeit — ohne eine Angabe lässt sich nicht sagen, wann man losfahren soll, und er wird verworfen. Mit Haken gilt die eingestellte Uhrzeit des betreffenden Tages als Terminbeginn."
H_FAHRZEIT = "Fahrzeitberechnung"
H_GANZTAGS = "Ganztagestermine"
H_ORTSBUCH = "Ortsbuch — Ortsangabe in eine Adresse übersetzen"
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
K_SICHERN = "Einstellungen sichern"
K_ZURUECK = "Einstellungen zurückspielen"
L_ANSAGE_VORLAGE = "Eigener Ansagetext"
L_DEPARTAT = "Fahrzeit für den <b>Abfahrtszeitpunkt</b> berechnen statt für jetzt"
L_GANZTAGS = "Ganztagestermine mit Ortsangabe berücksichtigen"
L_GANZTAGS_ZEIT = "Als Terminbeginn gilt"
L_MQTT_VOLLSEND = "Alle Werte erneut senden, auch unverändert, alle … Minuten"
L_QUIET_PUSH = "Sperrzeit gilt auch für die Push-Nachricht"
MERKWORT_HINWEIS = "<b>Die Ansage braucht dieses Merkwort.</b> <span class='sm-mono'>termin_say.php</span> liegt im unangemeldeten Bereich, damit Loxone es ohne Zugangsdaten erreicht — deshalb ist der Aufruf durch <span class='sm-mono'>&amp;token=…</span> geschützt. Ohne ihn könnte jeder im Netz beliebigen Text ansagen lassen, mit <span class='sm-mono'>&amp;force=1</span> sogar mitten in der Nacht, denn <i>force</i> umgeht die Sperrzeiten. Ebenso geschützt ist <span class='sm-mono'>termin.php?debug=1</span>, weil es neu rechnet und dabei den Kartendienst fragt. Der zyklische Leseaufruf von <span class='sm-mono'>termin.php</span> bleibt frei. Die Adresse oben enthält das Merkwort bereits."
MQTT_VOLLSEND_HINWEIS = "Gesendet wird sonst nur, was sich geändert hat. Startet der <b>Miniserver</b> neu, ohne dass der LoxBerry neu startet, bleiben seine virtuellen Eingänge deshalb leer, bis sich zufällig ein Wert bewegt. <b>Vorgabe 15 Minuten</b>, <b>0 = aus</b> (Verhalten bis 1.5.8)."
ORTSBUCH_HINWEIS = "Im Kalenderfeld <span class='sm-mono'>LOCATION</span> steht selten eine Adresse, sondern „Büro“ oder „Zahnarzt“. Hier steht, was damit gemeint ist. Verglichen wird zuerst wortgleich, dann als eigenständiges Wort innerhalb der Ortsangabe — <b>kein Teilwort, kein Raten</b>."
SICH_ABGELEHNT = "Die Datei wurde NICHT übernommen — es ist nichts geändert worden:"
SICH_ERKLAERUNG = "Für den <b>Umzug auf einen zweiten LoxBerry</b>: die Datei enthält alle Einstellungen dieses Plugins und lässt sich dort wieder einspielen."
SICH_FREMD = "Unbekannte Einstellung in der Datei: %s"
