[TEXT]
ANSAGE_HINWEIS = "Platzhalter: <span class='sm-mono'>{titel} {ort} {fahrt} {abfahrt_in} {beginn}</span>. Leer lassen für den mitgelieferten Text."
DEPARTAT_HINWEIS = "Ohne diesen Haken gilt die Verkehrslage von <i>jetzt</i> — für einen Termin in acht Stunden sagt die nichts. Mit Haken wird zweimal gefragt: einmal grob, dann noch einmal für den ermittelten Abfahrtszeitpunkt. <b>Das verdoppelt die Abfragen beim Kartendienst</b> (TomTom: Tageskontingent 2500, Google: Rechnung). Greift nur, wenn die Abfahrt mehr als 20 Minuten entfernt ist. <b>Ab Werk eingeschaltet</b> — wer sein Kontingent schonen muss, nimmt den Haken heraus."
FEHLER_ERLAEUTERUNG = "<b>Zu FEHLER=7:</b> Fällt der Kartendienst kurz aus, wird die zuletzt berechnete Fahrzeit bis zu eine Stunde lang weiterverwendet. <b>OK bleibt dabei 1</b>, die Werte gelten. Das ist Absicht: bräche die Berechnung stattdessen mit OK=0 und ABFAHRT_IN=9999 ab, fiele der Schwellwertschalter ab und löste beim nächsten gelungenen Abruf ein zweites Mal aus – derselbe Termin sägte also zweimal Bescheid. Wer die Degradierung sichtbar machen möchte, legt FEHLER auf einen Statusbaustein."
GANZTAGS_HINWEIS = "Ein Ganztagestermin nennt keine Uhrzeit — ohne eine Angabe lässt sich nicht sagen, wann man losfahren soll, und er wird verworfen. Mit Haken gilt die eingestellte Uhrzeit des betreffenden Tages als Terminbeginn."
