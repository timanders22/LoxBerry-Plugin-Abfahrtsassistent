[LOX]
S1_T = "Schritt 1: Weg festlegen"
S1 = "<b>MQTT ist der Regelweg.</b> Das Plugin rechnet im Hintergrund und schiebt jede Änderung von sich aus zum Miniserver — der muss nicht nachfragen, und es entsteht kein zyklischer Verkehr für Werte, die sich gar nicht geändert haben.<br><br>Der <b>virtuelle HTTP-Eingang</b> bleibt als Alternative bestehen. Er ist die richtige Wahl, wenn das MQTT-Gateway nicht laufen soll, und er taugt jederzeit als Gegenprobe. <b>Beide Wege gleichzeitig sind möglich, aber unnötig</b> — entscheiden Sie sich für einen und bauen Sie die Logik nur einmal."
S2_T = "Schritt 2: Das Abo im MQTT-Gateway"
S2 = "Die Themengruppe dieses Plugins lautet:"
S2_THEMEN = "Damit landen diese Themen im Miniserver. Loxone legt daraus beim nächsten Empfang selbst virtuelle Eingänge an — in Loxone Config unter <i>Virtuelle Eingänge</i> sichtbar, sobald der erste Wert angekommen ist."
H_ALTERNATIVE = "Alternative: virtueller HTTP-Eingang"
ALTERNATIVE_TEXT = "Die folgenden Schritte beschreiben den <b>zweiten</b> Weg — Loxone holt die Werte selbst ab. Wer MQTT nutzt, kann sie überspringen. Die Baustein-Liste weiter unten gilt für beide Wege; nur die Herkunft der Eingänge unterscheidet sich."
H_BAUSTEINE = "Komplette Baustein-Liste zum 1:1-Nachbauen"
BAUSTEINE_TEXT = "Von oben nach unten abarbeiten, dann ist die Funktion nachgebaut, ohne nachzudenken. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (<b>F5</b>). Die ersten acht Zeilen sind die Eingänge — bei MQTT kommen sie aus den Themen unten, beim HTTP-Weg aus den Befehlserkennungen von oben."
T_BAUSTEIN = "Baustein (Typ)"
T_NAME = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Eingänge verbinden mit"
B_EINGANG = "Virtueller Eingang (MQTT)"
B_THEMA = "Thema"
BAUSTEINE_ERLAEUTERUNG = "<b>Zu {B6} und {B7} (Daten veraltet):</b> Die Verzögerung <b>deutlich über</b> den Rechentakt legen — 600 s sind ein guter Wert. Virtuelle Eingänge behalten ihren letzten Wert; in der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr kommt. Genau dafür gibt es <span class='sm-mono'>ALTER</span>.<br><b>Zu {F:FEHLER} (FEHLER):</b> Der Wert <b>7</b> ist kein Ausfall — der Kartendienst war kurz weg und die letzte bekannte Fahrzeit gilt weiter. Wer darauf eine Meldung legt, bekommt sie ohne Not.<br><b>Zu {B12} und {B13}:</b> Der Benachrichtigungs-Baustein sendet nur beim <b>Wechsel von Aus auf Ein</b>. Niemals mehrere Quellen direkt an seinen Eingang — erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen. Für Versuche einen eigenen Benachrichtigungs-Baustein nehmen.<br><b>Zu {B3} bis {B6}:</b> Die unterschiedlichen Ein- und Ausschaltschwellen sind Absicht — ein Schwellwertschalter mit gleicher Schwelle flattert am Umschaltpunkt.<br><b>Optional:</b> Damit eine bereits fällige Abfahrt nach einem Miniserver-Neustart nicht verschluckt wird, einen <i>Systemstart-Impuls</i> → <i>Ausschaltverzögerung 300 s</i> als zusätzliche Quelle vor die ODER-Zusammenführung hängen."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE = "Im Reiter <i>Test</i> steht die Selbstprüfung — sie sagt, ob gerechnet wird und ob der MQTT-Weg vollständig ist. Stimmt dort alles, in Loxone Config den virtuellen Eingang <span class='sm-mono'>Abfahrt ABFAHRT_IN</span> öffnen: dieselbe Zahl muss dort stehen. <b>Erst dann</b> die Bausteine verdrahten — wer bei einem stummen Eingang mit dem Verdrahten anfängt, sucht den Fehler hinterher in der Logik statt in der Verbindung."
H_VORLAGE = "Alles auf einmal anlegen"
VORLAGE_TEXT = "Erzeugt eine Importdatei mit allen acht virtuellen Eingängen samt Titel, Bedeutung und Grenzen. <b>Hinweis:</b> Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
