HINWEIS = "Sucht die Konfiguration eines installierten Audioserver4Home- oder MusicServer4Home-Plugins und klopft ersatzweise die üblichen Ports auf diesem Gerät an. <b>Der Fund wird mit Quellenangabe gezeigt, nicht stillschweigend übernommen</b> — die Konfiguration von MS4H gehört nicht zu diesem Plugin und kann sich ändern. Der Knopf <b>speichert vorher das Formular</b> wie „Neu einlesen“, damit keine Eingabe verloren geht."
