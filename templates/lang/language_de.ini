K_SUCHEN = "Audio-Server suchen"
GEFUNDEN = "Gefunden: Port <b>%d</b>. Quelle: <span class='sm-mono'>%s</span>. Bitte prüfen und oben eintragen — automatisch übernommen wird nichts."
QUELLE_PORT = "Port %d antwortet auf 127.0.0.1 – vermutlich der Audio-Server"
