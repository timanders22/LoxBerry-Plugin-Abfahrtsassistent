SICH_UPLOAD_GRENZE = "Die Datei ist größer, als der Webserver annimmt (Grenzen: post_max_size %s, upload_max_filesize %s) – sie ist nicht angekommen. Eine Sicherung dieses Plugins ist wenige Kilobyte groß; bitte die richtige Datei wählen. Es wurde nichts verändert."
SICH_WARN_KNOPF = "Achtung: Beim Zurückspielen würde diese Sicherung abgewiesen – betroffen: %s. Heruntergeladen wird sie trotzdem vollständig. Unbekannte Einstellungen stammen meist aus einer anderen Fassung des Plugins."
