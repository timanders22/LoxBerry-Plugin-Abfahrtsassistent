T_BEFEHL_EIN = "Befehl bei EIN (Ausgangsbefehl)"
T_MERKWORT = "Aktuelles Merkwort"
LOGIK_TEXT = "<b>Logik auf der Programmierseite:</b> <span class='sm-mono'>ABFAHRT_IN</span> wird mit der eigenen Vorwarnzeit verglichen, zum Beispiel fünf Minuten. Fällt der Wert auf oder unter die Schwelle (Schwellwertschalter) und ist <span class='sm-mono'>OK=1</span>, dann schaltet der Miniserver bei <span class='sm-mono'>AUDIO=1</span> den Virtuellen Ausgang, und das Plugin spricht die Ansage mit Terminnamen und Fahrzeit. Bei <span class='sm-mono'>PUSH=1</span> löst er zusätzlich einen Benachrichtigungs-Baustein aus. Die Ansage selbst prüft die Sperrzeiten noch einmal und unterbleibt, solange das Plugin keinen gültigen Termin kennt.<br><br><b>Stolperfallen beim Benachrichtigungs-Baustein:</b> Er sendet nur beim <b>Wechsel von Aus auf Ein</b>. Steht der Auslöser schon auf Ein, etwa weil der Miniserver mitten in eine fällige Abfahrt hinein neu gestartet ist, geschieht nichts. Mehrere Quellen nie direkt auf denselben Eingang legen, sondern erst über einen ODER-Baustein zusammenführen. Für Versuche einen eigenen Benachrichtigungs-Baustein an einem Taster nehmen."
H_STATUS = "Optional: Statusbaustein für die App"
STATUS_TEXT = "Damit die Loxone-App jederzeit zeigt, wann es losgeht, einen <b>Status</b>-Baustein anlegen: Eingang 1 an <span class='sm-mono'>ABFAHRT_IN</span>, Eingang 2 an <span class='sm-mono'>FAHRT</span>, Eingang 3 an <span class='sm-mono'>OK</span>. Im Baustein zwei Texte: bei der Bedingung <i>Eingang 3 gleich 1</i> den Text <span class='sm-mono'>Nächster Termin: Abfahrt in &lt;v1.0&gt; min (Fahrzeit &lt;v2.0&gt; min)</span>, als Standardtext ohne Bedingung <span class='sm-mono'>Kein Termin mit Ortsangabe im Zeitfenster</span>. Dann im Baustein die Visualisierung einschalten."
H_AUDIO = "Muss ein Music Server oder Audioserver in Loxone verknüpft werden?"
AUDIO_TEXT = "<b>Loxone Music Server (klassisch) und Audioserver4Home/MusicServer4Home: nein.</b> Die Ansage schickt das Plugin selbst per HTTP an den Audio-Server (Adresse, Port und Zonen aus dem Reiter Einstellungen). In Loxone Config genügt der Virtuelle Ausgang von oben; die Musikzonen-Bausteine bleiben unberührt, und eine laufende Wiedergabe setzt der Music Server nach der Ansage fort.<br><br><b>Loxone Audioserver: ja.</b> Er hat keine HTTP-Schnittstelle für Sprachausgabe, der Miniserver muss die Ansage selbst auslösen: ein <b>Textgenerator</b> erzeugt den Text (Auslöser derselbe Impuls wie oben, also Schwelle erreicht, OK=1 und AUDIO=1), und sein Ausgang geht an den <b>TTS-Eingang</b> des <b>Audioplayers</b> der gewünschten Zone. Für mehrere Zonen den Ausgang an mehrere Audioplayer legen. In diesem Modus liefert <span class='sm-mono'>termin_say.php</span> nur den Text (<span class='sm-mono'>TEXT=…</span>) und spricht nicht selbst."
H_TECHNIK = "Technische Auskunft"
K_DEBUG = "Termin-Abfrage (Debug)"
H_LOEST_AUS = "Löst etwas aus"
TEST_KNOEPFE_HINWEIS = "<b>Termin-Abfrage (Debug)</b> rechnet neu und zeigt, welcher Termin gefunden wurde, die Fahrzeit, den Abfahrts-Countdown und je Kalender die Trefferzahl; dabei wird der Kartendienst gefragt. <b>Testansage</b> spricht sofort einen festen Satz mit den gespeicherten Einstellungen und umgeht bewusst Haken und Sperrzeiten – gedacht als Lautsprechertest; eine Push-Nachricht entsteht dabei nicht, die kommt vom Miniserver. Die Ansage des nächsten Termins löst Loxone über <span class='sm-mono'>termin_say.php</span> aus (mit <span class='sm-mono'>force=1</span> ohne Haken und Sperrzeiten). Neue Termine im Kalender erscheinen wegen des Zwischenspeichers bis zu zehn Minuten später; im Reiter Einstellungen holt „Neu einlesen“ sie sofort."
LOG_TEXT = "Protokolliert werden Wechsel im Ergebnis der Berechnung, jede Ansage oder ihre Unterdrückung, Abweisungen am Endpunkt, Änderungen der Konfiguration und Fehler. Die neuesten Einträge stehen oben, höchstens 300. LoxBerry räumt das Protokollverzeichnis regelmäßig auf; ein leeres Protokoll kann also auch heißen, dass es weggeräumt wurde."
