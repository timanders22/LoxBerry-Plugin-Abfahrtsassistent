H_LOEST_AUS = "Löst etwas aus"
K_ANSAGE = "Ansage jetzt auslösen"
TEST_KNOEPFE_HINWEIS = "<b>Termin-Abfrage (Debug)</b> rechnet neu und zeigt, welcher Termin gefunden wurde, die Fahrzeit, den Abfahrts-Countdown und je Kalender die Trefferzahl; dabei wird der Kartendienst gefragt. <b>Ansage jetzt auslösen</b> spricht sofort und umgeht bewusst Haken und Sperrzeiten (Parameter <span class='sm-mono'>force=1</span>) – gedacht als Lautsprechertest; eine Push-Nachricht entsteht dabei nicht, die kommt vom Miniserver. Neue Termine im Kalender erscheinen wegen des Zwischenspeichers bis zu zehn Minuten später; im Reiter Einstellungen holt „Neu einlesen“ sie sofort."
