[LOX]
S1_T = "Schritt 1: Weg festlegen"
S1 = "<b>MQTT ist der Regelweg.</b> Das Plugin rechnet im Hintergrund und schiebt jede Änderung von sich aus zum Miniserver — der muss nicht nachfragen, und es entsteht kein zyklischer Verkehr für Werte, die sich gar nicht geändert haben.<br><br>Der <b>virtuelle HTTP-Eingang</b> bleibt als Alternative bestehen. Er ist die richtige Wahl, wenn das MQTT-Gateway nicht laufen soll, und er taugt jederzeit als Gegenprobe. <b>Beide Wege gleichzeitig sind möglich, aber unnötig</b> — entscheiden Sie sich für einen und bauen Sie die Logik nur einmal."
S2_T = "Schritt 2: Das Abo im MQTT-Gateway"
S2 = "Die Themengruppe dieses Plugins lautet:"
S2_THEMEN = "Damit landen diese Themen im Miniserver. Loxone legt daraus beim nächsten Empfang selbst virtuelle Eingänge an — in Loxone Config unter <i>Virtuelle Eingänge</i> sichtbar, sobald der erste Wert angekommen ist."
H_ALTERNATIVE = "Alternative: virtueller HTTP-Eingang"
ALTERNATIVE_TEXT = "Die folgenden Schritte beschreiben den <b>zweiten</b> Weg — Loxone holt die Werte selbst ab. Wer MQTT nutzt, kann sie überspringen. Die Baustein-Liste weiter unten gilt für beide Wege; nur die Herkunft der Eingänge unterscheidet sich."
H_BAUSTEINE = "Komplette Baustein-Liste zum 1:1-Nachbauen"
BAUSTEINE_TEXT = "Von oben nach unten abarbeiten, dann ist die Funktion nachgebaut. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (<b>F5</b>). Die ersten neun Zeilen sind die Eingänge: bei MQTT legt das Gateway sie unter dem angegebenen Namen selbst an, beim HTTP-Weg sind es die Befehle aus der Importdatei."
T_BAUSTEIN = "Baustein (Typ)"
T_NAME = "Name (Eingänge: vom Gateway vergeben; Bausteine: Vorschlag)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Eingänge verbinden mit"
B_EINGANG = "Virtueller Eingang (MQTT)"
B_THEMA = "Thema"
BAUSTEINE_ERLAEUTERUNG = "<b>Zu {B6} und {B7} (Daten veraltet):</b> Über den HTTP-Weg liegt {B6} an <span class='sm-mono'>ALTER</span>; die Verzögerung deutlich über den Rechentakt legen, 600 s sind ein guter Wert. Über MQTT gibt es kein ALTER – dort zeigt das Lebenszeichen <span class='sm-mono'>status_ts</span> und <span class='sm-mono'>status_zaehler</span> einen Ausfall (Erklärung im Schritt 2). Virtuelle Eingänge behalten ihren letzten Wert; in der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr kommt.<br><b>Zu {F:FEHLER} (FEHLER):</b> Die Werte <b>5</b> und <b>7</b> sind kein Ausfall – eine Gegenstelle war kurz weg, und der letzte bekannte Stand gilt weiter. Wer darauf eine Meldung legt, bekommt sie ohne Not. <b>8</b> dagegen heißt, dass kein Kalender mehr lesbar ist.<br><b>Zu {B12} und {B13}:</b> Der Benachrichtigungs-Baustein sendet nur beim <b>Wechsel von Aus auf Ein</b>. Niemals mehrere Quellen direkt an seinen Eingang – erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu {B3} bis {B6}:</b> Die unterschiedlichen Ein- und Ausschaltschwellen sind Absicht – ein Schwellwertschalter mit gleicher Schwelle flattert am Umschaltpunkt.<br><b>Optional:</b> Damit eine bereits fällige Abfahrt nach einem Miniserver-Neustart nicht verschluckt wird, einen <i>Systemstart-Impuls</i> → <i>Ausschaltverzögerung 300 s</i> als zusätzliche Quelle vor die ODER-Zusammenführung hängen."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE = "Im Reiter <i>Test</i> steht die Selbstprüfung — sie sagt, ob gerechnet wird und ob das Lebenszeichen hinausgeht. Stimmt dort alles, in Loxone Config den virtuellen Eingang %s ansehen: er muss sich jede Minute ändern. Dann %s öffnen: dieselbe Zahl wie im Reiter MQTT muss dort stehen. <b>Erst dann</b> die Bausteine verdrahten — wer bei einem stummen Eingang mit dem Verdrahten anfängt, sucht den Fehler hinterher in der Logik statt in der Verbindung."
H_VORLAGE = "Alles auf einmal anlegen"
VORLAGE_TEXT = "Erzeugt eine Importdatei mit allen neun virtuellen Eingängen samt Titel, Bedeutung und Grenzen. <b>Hinweis:</b> Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
K_VORLAGE = "Importdatei für Loxone Config erzeugen"
T_LOXONE_NAME = "Name des Eingangs in Loxone"
B_NUR_HTTP = "nur über den HTTP-Weg (Befehl ALTER)"
VORLAGE_KOMMENTAR = "Erzeugt vom LoxBerry-Plugin Abfahrts-Assistent. Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine."

