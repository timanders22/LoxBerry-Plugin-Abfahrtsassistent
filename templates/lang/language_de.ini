[LOX]
S1_T = "Schritt 1: Weg festlegen"
S1 = "<b>MQTT ist der Regelweg.</b> Das Plugin rechnet im Hintergrund und schiebt jede &Auml;nderung von sich aus zum Miniserver &mdash; der muss nicht nachfragen, und es entsteht kein zyklischer Verkehr f&uuml;r Werte, die sich gar nicht ge&auml;ndert haben.<br><br>Der <b>virtuelle HTTP-Eingang</b> bleibt als Alternative bestehen. Er ist die richtige Wahl, wenn das MQTT-Gateway nicht laufen soll, und er taugt jederzeit als Gegenprobe. <b>Beide Wege gleichzeitig sind m&ouml;glich, aber unn&ouml;tig</b> &mdash; entscheiden Sie sich f&uuml;r einen und bauen Sie die Logik nur einmal."
S2_T = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2 = "Im LoxBerry unter <b>System &rarr; MQTT Gateway &rarr; Subscriptions</b> eintragen:"
S2_THEMEN = "Damit landen diese Themen im Miniserver. Loxone legt daraus beim n&auml;chsten Empfang selbst virtuelle Eing&auml;nge an &mdash; in Loxone Config unter <i>Virtuelle Eing&auml;nge</i> sichtbar, sobald der erste Wert angekommen ist."
H_ALTERNATIVE = "Alternative: virtueller HTTP-Eingang"
ALTERNATIVE_TEXT = "Die folgenden Schritte beschreiben den <b>zweiten</b> Weg &mdash; Loxone holt die Werte selbst ab. Wer MQTT nutzt, kann sie &uuml;berspringen. Die Baustein-Liste weiter unten gilt f&uuml;r beide Wege; nur die Herkunft der Eing&auml;nge unterscheidet sich."
H_BAUSTEINE = "Komplette Baustein-Liste zum 1:1-Nachbauen"
BAUSTEINE_TEXT = "Von oben nach unten abarbeiten, dann ist die Funktion nachgebaut, ohne nachzudenken. Die Bausteine finden sich in Loxone Config &uuml;ber die Baustein-Suche (<b>F5</b>). Die ersten acht Zeilen sind die Eing&auml;nge &mdash; bei MQTT kommen sie aus den Themen unten, beim HTTP-Weg aus den Befehlserkennungen von oben."
T_BAUSTEIN = "Baustein (Typ)"
T_NAME = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_VERBINDEN = "Eing&auml;nge verbinden mit"
B_EINGANG = "Virtueller Eingang (MQTT)"
B_THEMA = "Thema"
BAUSTEINE_ERLAEUTERUNG = "<b>Zu #14 und #15 (Daten veraltet):</b> Die Verz&ouml;gerung <b>deutlich &uuml;ber</b> den Rechentakt legen &mdash; 600 s sind ein guter Wert. Virtuelle Eing&auml;nge behalten ihren letzten Wert; in der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr kommt. Genau daf&uuml;r gibt es <span class='sm-mono'>ALTER</span>.<br><b>Zu #5 (FEHLER):</b> Der Wert <b>7</b> ist kein Ausfall &mdash; der Kartendienst war kurz weg und die letzte bekannte Fahrzeit gilt weiter. Wer darauf eine Meldung legt, bekommt sie ohne Not.<br><b>Zu #20 und #21:</b> Der Benachrichtigungs-Baustein sendet nur beim <b>Wechsel von Aus auf Ein</b>. Niemals mehrere Quellen direkt an seinen Eingang &mdash; erst &uuml;ber ODER zusammenf&uuml;hren, sonst verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen. F&uuml;r Versuche einen eigenen Benachrichtigungs-Baustein nehmen.<br><b>Zu #11 bis #14:</b> Die unterschiedlichen Ein- und Ausschaltschwellen sind Absicht &mdash; ein Schwellwertschalter mit gleicher Schwelle flattert am Umschaltpunkt.<br><b>Optional:</b> Damit eine bereits f&auml;llige Abfahrt nach einem Miniserver-Neustart nicht verschluckt wird, einen <i>Systemstart-Impuls</i> &rarr; <i>Ausschaltverz&ouml;gerung 300 s</i> als zus&auml;tzliche Quelle vor die ODER-Zusammenf&uuml;hrung h&auml;ngen."
H_GEGENPROBE = "Gegenprobe"
GEGENPROBE = "Im Reiter <i>Test</i> steht die Selbstpr&uuml;fung &mdash; sie sagt, ob gerechnet wird und ob der MQTT-Weg vollst&auml;ndig ist. Stimmt dort alles, in Loxone Config den virtuellen Eingang <span class='sm-mono'>Abfahrt ABFAHRT_IN</span> &ouml;ffnen: dieselbe Zahl muss dort stehen. <b>Erst dann</b> die Bausteine verdrahten &mdash; wer bei einem stummen Eingang mit dem Verdrahten anf&auml;ngt, sucht den Fehler hinterher in der Logik statt in der Verbindung."
H_VORLAGE = "Alles auf einmal anlegen"
VORLAGE_TEXT = "Erzeugt eine Importdatei mit allen acht virtuellen Eing&auml;ngen samt Titel, Bedeutung und Grenzen. <b>Hinweis:</b> Loxone Config legt beim Import neu an und &uuml;berschreibt nichts &mdash; zweimal eingelesen ergibt doppelte Bausteine. Die Adresse im Kopf ist ein Vorschlag; bitte pr&uuml;fen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
