[MQTT]
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_TEXT = "Die Themengruppe dieses Plugins lautet:"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> das Plugin bringt die Datei <span class='sm-mono'>mqtt_subscriptions.cfg</span> mit der Themengruppe mit, und das Gateway liest sie selbst; trägt sie das Präfix nicht, gehört die Zeile unter <i>System → MQTT Gateway</i> in den Abschnitt <i>Subscriptions</i>. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den Subscriptions, einzutragen ist nichts."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Subscriptions</i> erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht."
ABO_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Die Abo-Datei des Plugins (<span class='sm-mono'>mqtt_subscriptions.cfg</span>) trägt die Themengruppe nicht; sie wird beim nächsten Speichern im Reiter MQTT und im Minutentakt nachgeführt. Bis dahin gehört die Zeile unter <i>System → MQTT Gateway</i> in den Abschnitt <i>Subscriptions</i>; danach speichern."
FEHLER_TOPIC = "Das MQTT-Thema darf nicht leer sein."
H_ABO = "Das Abo im MQTT-Gateway"
H_THEMEN = "Veröffentlichte Themen"
KEIN_ABSCHNITT = "In der <span class='sm-mono'>general.json</span> von LoxBerry gibt es keinen MQTT-Abschnitt. Das MQTT-Gateway ist Teil des Systems und wird unter System → MQTT Gateway eingeschaltet — es ist kein Plugin."
KEIN_AUTOSTART = "Das MQTT-Gateway steht nicht auf Autostart (System → MQTT Gateway). Es wird gesendet, aber vermutlich hört niemand zu."
L_EIN = "Werte über MQTT veröffentlichen"
L_TOPIC = "MQTT-Thema (Präfix)"
OK = "Das MQTT-Gateway ist eingerichtet, UDP-Eingang %d."
T_BEDEUTUNG = "Bedeutung"
T_THEMA = "Thema"
T_RETAIN = "zurückbehalten"
RETAIN_JA = "ja"
RETAIN_NEIN = "nein"
RETAIN_ERKLAERUNG = "Zurückbehalten (retained) wird kein Thema dieses Plugins. OK und FEHLER sind Aussagen des Dienstes über sich selbst, AUDIO und PUSH hängen an den Sperrzeiten und werden allein durch die Uhr falsch – zurückbehalten stünden sie nach einem Ausfall des Dienstes weiter als gültig da. Der Dienst bildet die Werte in jedem Minutentakt, auch wenn er nicht neu rechnet, und sendet, was sich geändert hat: AUDIO und PUSH folgen der Sperrzeit binnen einer Minute. Nach einem Neustart des Miniservers fehlen die Werte bis zum nächsten Vollversand (ab Werk spätestens nach 15 Minuten). Bis 1.6.12 gingen die vier Zustände zurückbehalten hinaus; ihre Altwerte räumt das Plugin selbst ab, bei der Deinstallation ebenso."
T_WERT = "zuletzt"
WARUM = "<b>MQTT ist der bevorzugte Weg.</b> Das Plugin rechnet im Hintergrund und schiebt jede Änderung von sich aus zum Miniserver — der muss also nicht alle fünf Minuten nachfragen. Gesendet wird nur, was sich tatsächlich geändert hat; unveränderte Werte belegen den Broker nicht. Der virtuelle HTTP-Eingang aus dem Reiter <i>Einbindung in Loxone</i> bleibt daneben bestehen — als Gegenprobe und für alle, die ihn gewohnt sind."
RETAIN_NIE = "nie"
LZ_TS = "Lebenszeichen: Zeitpunkt des letzten Dienstlaufs (Unix-Sekunden)"
LZ_ZAEHLER = "Lebenszeichen: Zähler, läuft je Minute von 0 bis 999 um"
LZ_OK = "Lebenszeichen: 1 = die letzte Berechnung ist höchstens elf Minuten alt"
LZ_ERKLAERUNG = "<b>Ausfallerkennung über MQTT:</b> Das Lebenszeichen geht bei jedem Minutentakt hinaus und wird nie zurückbehalten. Bleibt <span class='sm-mono'>status_zaehler</span> länger als ein paar Minuten stehen, ist der Dienst oder der Weg zum Miniserver ausgefallen. Das Alter in Sekunden ist <span class='sm-mono'>(Loxone-Zeit + 1230768000) − status_ts</span>. <b>ALTER geht nicht über MQTT</b> – dort war es bis 1.6.9 immer 0 und zeigte deshalb nie einen Ausfall; über den HTTP-Weg stimmt es."
ABO_MITGELIEFERT = "<b>Das Plugin bringt sein Abo selbst mit</b> — einzutragen ist nichts. Die Datei <span class='sm-mono'>mqtt_subscriptions.cfg</span> im Konfigurationsordner des Plugins trägt die Themengruppe; das MQTT-Gateway (Fassung&nbsp;1) liest sie selbst. In der Abo-Liste der Gateway-Oberfläche erscheint sie nicht, Plugin-Abos hält das Gateway im Speicher. Wer das Präfix ändert, bekommt die Datei beim Speichern nachgeführt."
M_ANLASS_AUS = "MQTT ausgeschaltet"
M_ANLASS_WECHSEL = "Präfix gewechselt"
M_RAEUMEN_NICHTS = "%s: Unter %s/ kann nichts zurückbehalten stehen (der Broker hat es für dieses Präfix schon bestätigt), geräumt werden musste nichts."
M_RAEUMEN_BESTAETIGT = "%s: Der Broker bestätigt, dass unter %s/ nichts zurückbehalten steht."
M_RAEUMEN_GELEERT = "%s: Die zurückbehaltenen Altwerte unter %s/ sind geleert, der Broker bestätigt es."
M_RAEUMEN_REST = "%s: Unter %s/ stehen noch zurückbehaltene Werte (%s). Von Hand: mosquitto_pub -r -n -t <Thema>"
M_RAEUMEN_UNBEKANNT = "%s: Die möglichen Altwerte unter %s/ wurden mit leerer Nutzlast gelöscht; der Broker ließ sich nicht befragen, nachgelesen ist es nicht."
M_RAEUMEN_KEIN_PORT = "%s: Unter %s/ wurde nichts geräumt – das MQTT-Gateway nennt keinen UDP-Eingang."
M_RAEUMEN_KEIN_EINGANG = "%s: Unter %s/ wurde nichts geräumt – der UDP-Eingang des Gateways war nicht erreichbar."

