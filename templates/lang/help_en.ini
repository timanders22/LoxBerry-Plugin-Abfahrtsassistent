; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Departure assistant"
K02 = "Tells you when to set off: the plugin reads up to <b>10 iCal calendars</b> (Google Calendar, for example), looks for the next appointment <b>with a location</b>, determines the current <b>travel time including traffic</b> (TomTom, Google Maps or HERE) and works out the departure time from that:"
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4.0</b> (pure PHP 8, no extra packages). Recurring appointments are expanded in full (daily/weekly/monthly/yearly with INTERVAL, BYDAY, UNTIL, COUNT; EXDATE; individually moved or deleted instances through RECURRENCE-ID/STATUS:CANCELLED; DST-safe). [v1.1.0]"
K04 = "<b>v1.1.1:</b> the configuration survives updates (preupgrade/postupgrade); the zone field accepts a plain zone list (<code>2,4,6</code>) &mdash; the volume then comes from the volume field; <code>zone~volume</code> per zone is still possible."
K05 = "If something does not work"
K06 = "The <i>Test</i> tab has a <b>self-check</b> that answers, without Loxone, whether the setup holds — from the bottom up: calendars, API key, address, file permissions, is the background service running, what did it last calculate, holiday source, audio output, quiet hours, MQTT route, template. The first failed entry is usually the cause."
K07 = "<b>About <code>FEHLER=7</code>:</b> the map service was briefly unreachable, the last known travel time still applies, <code>OK</code> stays 1. That is deliberate — if the calculation aborted instead, the threshold switch in Loxone would drop out briefly and then trigger a second time: the same appointment would announce itself twice."
K08 = "Configuration (plugin interface)"
K09 = "Up to 10 calendars (name + private iCal URL)"
K10 = "Map service: <b>TomTom</b> / <b>Google Maps</b> / <b>HERE</b> + an API key of your own"
K11 = "Departure address (home)"
K12 = "<b>Arrive X minutes before the appointment</b> and a <b>buffer time</b>"
K13 = "Speech output:"
K14 = "<b>Loxone Music Server</b> (classic): direct TTS announcement through port 7091"
K15 = "<b>Audioserver4Home / MusicServer4Home</b>: URL template (adjustable)"
K16 = "<b>The original Loxone Audioserver</b>: has no HTTP TTS interface — the plugin supplies the announcement text, the output happens in Loxone Config through a text generator → the TTS input of the audio player block"
K17 = "<b>Your own URL template</b> with the placeholders <code>{ip} {port} {zones} {vol} {lang} {text}</code>"
K18 = "The plugin contains <b>no personal data</b> — calendar URLs, the API key and addresses are stored exclusively in the local configuration (<code>config/plugins/&lt;plugin&gt;/abfahrt.json</code>)."
K19 = "The route to Loxone"
K20 = "<b>From 1.5.0 onwards MQTT is the normal route.</b> The plugin calculates in the background (cron, every minute) and pushes every change to the Miniserver itself. For that the subscription <code>abfahrt/#</code> has to be entered in the MQTT gateway (System → MQTT Gateway → Subscriptions) — <b>without that entry nothing arrives at the Miniserver</b>, which is the most common cause of failure. The <i>MQTT</i> tab shows the subscription and all topics."
K21 = "The <b>virtual HTTP input</b> remains as an alternative. Important: <code>termin.php</code> <b>no longer calculates by itself</b> but outputs the current state. As a result the number of requests to the map service no longer depends on how often Loxone asks. Only <code>?debug=1</code> recalculates."
K22 = "The <i>Loxone integration</i> tab generates a ready-made import file for Loxone Config at the press of a button and contains the complete list of blocks to rebuild it — for both routes."
K23 = "Endpoints (for Loxone)"
K24 = "<b>Virtual HTTP input</b> (every 5 min): command recognition <code>\iABFAHRT_IN=\i\v</code>. <b>Virtual output</b> (on departure/pre-warning): <code>/plugins/abfahrtsassistent/termin_say.php</code>."
K25 = "Notes"
K26 = "Appointments without a location (LOCATION) are ignored — a travel time can only be calculated for appointments with a destination."
K27 = "All-day appointments are ignored."
K28 = "Request limits: ICS cache 10 min, route cache 5 min, geocoding permanent."
K29 = "<b>v1.2.0:</b> audio output and push message can be enabled separately; quiet hours for the audio output per weekday (across midnight too); flags <code>AUDIO=</code>/<code>PUSH=</code> in the termin.php output for Loxone; umlauts correct in the announcement („Nächster“); the test button bypasses the blocks (<code>?force=1</code>)."
K30 = "<b>v1.3.0:</b> admin interface with tabs (Settings / Loxone integration with a guide for non-experts / Test / Log files); a „re-read calendar“ button per calendar; logging (result changes, announcements, errors); the configuration backup additionally outside the plugin folder (survives a reinstallation too); empty calendar names stay empty (placeholder); quiet-hours defaults 20:00–07:00; a compact quiet-hours layout."
K31 = "<b>v1.3.1:</b> layout corrections: LoxBerry's own jQuery Mobile styles neutralised (<code>data-role='none'</code> + CSS) — calendar fields full width again, „re-read“ compact, tabs and buttons without shadows, white text on coloured buttons."
K32 = "<b>v1.3.2:</b> the Loxone guide extended by a status block (step 4) and audio system wiring (step 5: Music Server/MS4H = no Loxone link needed; the original Audioserver = text generator → TTS input); log box without a shadow; status line in whole minutes (rounded up); default volume 8 %; zones: a space after the comma is allowed; the log file survives updates."
K33 = "<b>v1.3.3:</b> the Loxone guide: step 6 with a complete list of blocks for a one-to-one rebuild (including the pre-warning, an inverted threshold switch, an AND gate, audio/push gates, catching up after a restart; and an explanation of why no arrival-reserve block is needed)."
K34 = "<b>v1.3.4:</b> the interface in LoxBerry green (#6dac20)."
K35 = "<b>v1.3.5:</b> guide: the arrival-reserve paragraph removed; practical notes on the notification block added (edge behaviour, no multiple sources on the push input, a test block of your own)."
K36 = "<b>v1.3.6:</b> online appointment filter: locations such as „ONLINE“, „Teams“, „Zoom“ (a configurable list) and meeting links (http/https) are ignored — no travel time calculation for video conferences."
K37 = "<b>v1.3.7:</b> the default announcement volume lowered from 20 % to 8 %; announcements now begin with „Hallo!“ instead of „Ding Dong!“. Both affect only the defaults of new installations — existing settings are kept. New in the quiet hours: three additional rows for <b>public holiday, school holidays and leave</b>, which take precedence over the weekday (order of checking: leave → public holiday → school holidays → weekday). That lets the announcement be released later on days off. The special days come from the optional LoxBerry plugin „School holidays and public holidays“ (leave = an appointment of your own of the kind „leave (away)“); if it is not installed, the three rows have no effect and the weekday table alone applies. Anonymised for publication (author entry, MIT licence, privacy note) — note: because of the changed author entry LoxBerry may treat the plugin as „new“; the configuration survives that thanks to the backup outside the plugin folder."
K38 = "Privacy"
K39 = "The plugin contains <b>no personal data</b>. Calendar URLs, the API key, addresses and zones are kept exclusively in the local configuration (<code>config/plugins/abfahrtsassistent/abfahrt.json</code>) and are never shipped. External connections exist only to the calendars entered by the user and to the chosen map service (TomTom, Google Maps or HERE)."
K40 = "<b>v1.5.0:</b> MQTT push through the LoxBerry gateway including a tab of its own (only changes are sent); the calculation moved into the background service — <code>termin.php</code> only reads; an import file for Loxone Config at the press of a button; the list of blocks rewritten for MQTT; a self-check on the <i>Test</i> tab; the field <code>FEHLER</code> with a numeric code and <code>ALTER</code> for outage detection; the travel time stays valid for up to an hour if the map service fails; the route cache scales with the proximity of the appointment; recurring appointments are fast-forwarded; audio server discovery; the web server port taken from <code>general.json</code>; the configuration with permissions 0600."
K41 = "Endpoint"
K42 = "Purpose"
K43 = "<code>/plugins/abfahrtsassistent/termin.php</code>"
K44 = "Flat text: <code>TERMIN;OK=1;MINSTART=..;FAHRT=..;ABFAHRT_IN=..;FEHLER=..;ALTER=..;AUDIO=..;PUSH=..</code> — reads only"
K45 = "<code>/plugins/abfahrtsassistent/termin.php?debug=1</code>"
K46 = "Diagnosis — <b>recalculates</b>"
K47 = "<code>/plugins/abfahrtsassistent/termin_say.php</code>"
K48 = "Trigger the announcement (or <code>TEXT=...</code> in Audioserver mode)"
